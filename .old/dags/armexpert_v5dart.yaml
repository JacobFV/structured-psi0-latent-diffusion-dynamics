# W7 D-110: v5dart = the v4dart config + "grasp_contact": "v2" (teacher v2 + grasp contact v2), packed like
# latent_pp_v4dart_s1_H16 (13 source-train bodies, H16, stride 1, DART failures included). The pack refuses mixed grasp
# physics and records grasp_contact_version in meta.json. Peer placement; the pack dir is a symlink to the peer disk.
# Measured peaks (declared +20%): collect 14.2 GB (4 workers), pack anon 16.7 GB -> mem 24G (D-117: >= 1.35 x peak).
name: armexpert_v5dart
schema: dag-1
family: arm
track: armexpert
lineage: v5dart
label_prefix: axv5
defaults:
  placement: peer
  retries: 0
  max_parallel: 1
  resources: {cpu: 6, mem: 12G, gpu: false, max_seconds: 14400}
base:
  variant: na
  seed: 1
  flags: {zero_prev_action: null, realizer_anchor: null, realizer_drop_qd: null, probe_lv_min: null, qd_dropout: null, contact_version: contact_v1}
nodes:
  collect:
    stage: collect
    tag: v5dart
    resources: {cpu: 4, mem: 16G, max_seconds: 14400}
    config:
      options: {workers: 4}
      params: {"name": "pick_place_primary_v5dart", "workers": 6, "max_distractors": 2, "items": [{"robot": "parm5_pg2", "split": "source_train", "seed_start": 0, "episodes": 300, "dart_noise": [0.08]}, {"robot": "parm5_tf3", "split": "source_train", "seed_start": 0, "episodes": 300, "dart_noise": [0.08]}, {"robot": "parm5s_pg2", "split": "source_train", "seed_start": 0, "episodes": 300, "dart_noise": [0.08]}, {"robot": "parm5l_tf3", "split": "source_train", "seed_start": 0, "episodes": 300, "dart_noise": [0.08]}, {"robot": "parm6_pg2", "split": "source_train", "seed_start": 0, "episodes": 300, "dart_noise": [0.08]}, {"robot": "parm6_tf3", "split": "source_train", "seed_start": 0, "episodes": 300, "dart_noise": [0.08]}, {"robot": "parm7_pg2", "split": "source_train", "seed_start": 0, "episodes": 300, "dart_noise": [0.08]}, {"robot": "parm7_tf3", "split": "source_train", "seed_start": 0, "episodes": 300, "dart_noise": [0.08]}, {"robot": "panda_pg2", "split": "source_train", "seed_start": 0, "episodes": 300, "dart_noise": [0.08]}, {"robot": "ur5e_pg2", "split": "source_train", "seed_start": 0, "episodes": 300, "dart_noise": [0.08]}, {"robot": "ur5e_tf3", "split": "source_train", "seed_start": 0, "episodes": 300, "dart_noise": [0.08]}, {"robot": "sawyer_pg2", "split": "source_train", "seed_start": 0, "episodes": 300, "dart_noise": [0.08]}, {"robot": "sawyer_tf3", "split": "source_train", "seed_start": 0, "episodes": 300, "dart_noise": [0.08]}, {"robot": "xarm7_pg2", "split": "target_demos", "seed_start": 1000000, "episodes": 150}, {"robot": "xarm7_tf3", "split": "target_demos", "seed_start": 1000000, "episodes": 150}, {"robot": "panda_tf3", "split": "target_demos", "seed_start": 1000000, "episodes": 150}], "split_file": "research/splits/primary_v1.json", "teacher_version": "v2", "grasp_contact": "v2"}
  pack:
    stage: pack
    tag: v5dart_s1_H16
    deps: [collect]
    resources: {cpu: 2, mem: 24G, max_seconds: 14400}
    config:
      inputs: {dataset: '@collect'}
      params: {"name": "latent_pp_v5dart_s1_H16", "train_robots": ["panda_pg2", "parm5_pg2", "parm5_tf3", "parm5l_tf3", "parm5s_pg2", "parm6_pg2", "parm6_tf3", "parm7_pg2", "parm7_tf3", "sawyer_pg2", "sawyer_tf3", "ur5e_pg2", "ur5e_tf3"], "horizon": 16, "stride": 1, "include_dart_failures": true}
