# ARM V2-TEACHER LINEAGES (D-102): the arm lineage DAG (dags/arm_lineage.yaml, same recipe, rounds, seeds, collection
# seeds, eval sets and edit suite) on v2 components ONLY:
#   data  = datasets/pick_place_primary_v4dart + pack latent_pp_v4dart_s1_H16 (scripted_teacher:pick_place_v2_minjerk)
#   DAgger labeller / stateless-R1 expert = learned:bcv2_direct1701 at u12000 (sha256[:16] 6afcb8efdc277708; trained on
#   v4dart, research/tracks/armexpert.md), replacing direct1701_u12000 (v1 data).
# Variants: semfix and nosem (the defective original sem is dropped) x training seeds 1, 2. Everything else is inherited.
# Resources (lead: <= 2 concurrent GPU leases, <= 10 CPU on the peer): collections run 4 workers x 2 threads (8 CPU;
# threads do not change results), the edit suite 6 workers. Outputs artifacts/runs/armv2/arm2-<variant>/...
#   rrp run-dag dags/arm_lineage_v2.yaml --dry-run
#   RRP_PEER_REPO=/dev/shm/rrp-brandonin/wt/armv2 rrp run-dag dags/arm_lineage_v2.yaml
extends: arm_lineage.yaml
name: arm_lineage_v2
track: armv2
lineage: 'arm2-{variant}'
label_prefix: 'a2{tg}{seed}'
matrix:
  variant: [semfix, nosem]
  seed: [1, 2]
vars:
  pfx: 'arm2_{variant}_s{seed}'
  dataset: datasets/pick_place_primary_v4dart
  pack: packed/latent_pp_v4dart_s1_H16
  bc_policy: 'runs/armexpert_bcv2/baseline_direct_action/seed1701/source:policy_u12000.pt'
  bc_label: bcv2_direct1701_u12000
defaults:
  max_parallel_gpu: 2     # base allocation (lead); raise to 4 only while W8 holds no peer GPU leases (06:05-07:50 it was 4)
  max_cpu: 10             # declared CPU
nodes:
  # Resources (lead 08:05): declare measured peak memory + 20% so the broker admits correctly. Peaks = cgroup
  # memory.peak of the lease slice (page cache included), sampled by scripts/armv2_mem_sampler.sh into
  # artifacts/runs/armv2/_dags/arm_lineage_v2/memory_peaks.json and, from the next code push, logged by rrp.ops.child.
  # cpu 2 for GPU-training nodes (lead 08:55: flows and Stage A measured ~1.0 core; threads only feed data prep).
  # gpu_mem = measured process GPU memory (nvidia-smi) + margin. max_seconds = the broker's 6 h cap on GPU nodes (06:05:
  # under contention Stage A ran at 1.28 s/step and was stopped at 4 h). None of this enters the node config hashes.
  stageA: {resources: {cpu: 2, mem: 12G, gpu_mem: 2G, max_seconds: 21600}}           # measured slice peak 9.5G / ~1 GB GPU
  F0: {resources: {cpu: 2, mem: 10G, gpu_mem: 4G, max_seconds: 21600}}               # provisional until measured
  Fft: {resources: {cpu: 2, mem: 10G, gpu_mem: 4G, max_seconds: 21600}}
  Fgdag1: {resources: {cpu: 2, mem: 10G, gpu_mem: 4G, max_seconds: 21600}}
  Fgdag2h: {resources: {cpu: 2, mem: 10G, gpu_mem: 4G, max_seconds: 14400}}
  rzbcdag1: {resources: {cpu: 2, mem: 8G, gpu_mem: 3G, max_seconds: 21600}}          # provisional until measured
  rzbcdag1long: {resources: {cpu: 2, mem: 8G, gpu_mem: 3G, max_seconds: 21600}}
  rzbcdag2: {resources: {cpu: 2, mem: 8G, gpu_mem: 3G, max_seconds: 21600}}
  rzgendag1: {resources: {cpu: 2, mem: 8G, gpu_mem: 3G, max_seconds: 21600}}
  rzgendag2: {resources: {cpu: 2, mem: 8G, gpu_mem: 3G, max_seconds: 21600}}
  rzgendag3: {resources: {cpu: 2, mem: 8G, gpu_mem: 3G, max_seconds: 21600}}
  bc1: {resources: {cpu: 8, mem: 20G}, config: {options: {workers: 4, threads: 2}}}    # a v1 gen2 group needed > 8G (OOM), 16G ran
  bc2: {resources: {cpu: 8, mem: 20G}, config: {options: {workers: 4, threads: 2}}}
  bc3: {resources: {cpu: 8, mem: 20G}, config: {options: {workers: 4, threads: 2}}}
  gen1: {resources: {cpu: 8, mem: 20G}, config: {options: {workers: 4, threads: 2}}}
  gen2: {resources: {cpu: 8, mem: 20G}, config: {options: {workers: 4, threads: 2}}}
  gen3: {resources: {cpu: 8, mem: 20G}, config: {options: {workers: 4, threads: 2}}}
  gdag1: {resources: {cpu: 8, mem: 20G}, config: {options: {workers: 4, threads: 2}}}
  gdag2: {resources: {cpu: 8, mem: 20G}, config: {options: {workers: 4, threads: 2}}}
  finalevals: {resources: {mem: 6G}}
  heldout: {resources: {mem: 6G}}
  prog20k: {resources: {mem: 6G}}
  proggdag1: {resources: {mem: 6G}}
  orcbc: {resources: {mem: 6G}}
  semedits: {resources: {cpu: 6, mem: 12G}, config: {options: {workers: 6}}}
