# Step 2 on G1WholebodyHandoverTeleop-v0 (public data; released ckpt reproduced 7/10 at step 1, published 7|7|10). Bimanual: the active
# hand changes within an episode (time-varying labels, data.py). Same template, protocol and seeds as tabletop / bendpick (D-147 T7).
# The older v1 Handover stage A / structured arms (psi1z, pre-P-009) are NOT reused. Labels are recorded by the `labels` node.
extends: ../templates/psi0_step2.yaml
name: psi0_handover_step2
schema: dag-1
track: psi0
policy: psi0_structured
env: simple
task: simple/G1WholebodyHandoverTeleop-v0
bodies: g1_simple
factors: []
vars:
  task: G1WholebodyHandoverTeleop-v0
  task_key: handover
nodes:
  feat:      # D-147 T7: tabletop feat peaked 13.6 G THROTTLED at memory.high (0.8 x 17G); bendpick feat 14.06 G throttled, killed by memory PSI.
    resources: {cpu: 2, mem: 28G, gpu: true, gpu_mem: 18G, max_seconds: 21600}   # shm-charged: shards (~5 G) + hidden.npy (~6.5 G) coexist at build_memmap, + RSS; throttled peaks underestimate
