# LEAVE-ONE-OUT dev transfer, task h_turn (D-147 addendum 2026-10-03, item 3; template recipes/templates/humanoid_transfer_loo.yaml).
# For each held-out dev body X in {t1, g1, h1}: latent semfix (preset:legged / legged-none) and BC train on the T4 SOURCE demos of the other two
# bodies only (existing run humanoid-transfer-h_turn/collect-src_s0, not re-collected), seeds 0 and 1; zero-shot on X, development scenes.
# Teacher reference: the scripted teacher over the installed `ub_v1` of X (the tracker of the T4 collect). No sealed body or scene, no adaptation.
# Run after T5's own nodes for h_turn. SOURCES are labelled per method: teacher = scripted_teacher, latent = learned, bc = bc.
extends: ../templates/humanoid_transfer_loo.yaml
name: humanoid_transfer_loo_h_turn
schema: dag-1
track: humanoid
policy: latent
env: mujoco/legged
task: h_turn
bodies: humanoid_pool_v1
factors: []
vars: {task: h_turn}
lists:
  transfer:
    env_kw: {tracker: '<body>:ub_v1'}    # D-147 (10-04): the collection body tracker; a policy whose factors read terrain gets the PUBLIC scan (D-146 amendment, option A; humanoid_eval.build_policy)
    caveats: ['FAIR-INPUT CAVEAT (D-147 10-04): preset:legged policies read the public terrain scan (cells) and limb / foot tokens; legged-none policies read neither, so legged vs legged-none mixes the relation factors with extra input; proposed control: legged-none + scan (not run)']
    name: humanoid_transfer_loo_h_turn
    task: h_turn
    latent_kw: {upper: true}
    methods:
      reference:
        - name: teacher
          level: 0
          kind: teacher
          source: scripted_teacher
          policy: 'teacher:<task>'
          env_kw: {tracker: '<body>:ub_v1'}
