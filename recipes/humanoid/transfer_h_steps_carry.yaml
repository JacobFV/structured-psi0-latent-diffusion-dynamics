# M1 carry over a 2-step staircase (held out, evaluation only). (D-146 R2 HR; template recipes/templates/humanoid_transfer_heldout.yaml; nodes listed in research/tracks/humanoid.md section HR.)
# EVAL ONLY (the split is frozen, D-138): no collect, pack, train or adapt node; the template holds the zero-shot `h_carry` checkpoint methods.
# Teacher reference = the scripted teacher over the installed `steps_ub_v1` tracker. `sealed: true` is flipped only by the lead.
extends: ../templates/humanoid_transfer_heldout.yaml
name: humanoid_transfer_h_steps_carry
schema: dag-1
track: humanoid
policy: latent
env: mujoco/legged
task: h_steps_carry
bodies: humanoid_pool_v1
factors: []
vars: {task: h_steps_carry, upper: true, seal0: g1_hands, seal1: n1}
lists:
  transfer:
    name: humanoid_transfer_h_steps_carry
    task: h_steps_carry
    methods:
      reference:
        - name: teacher
          level: 0
          kind: teacher
          source: scripted_teacher
          policy: 'teacher:h_steps_carry'
          env_kw: {tracker: '<body>:steps_ub_v1'}
  teacher_check:
    name: humanoid_transfer_h_steps_carry_teacher_check
    task: h_steps_carry
    env: mujoco/legged
    train_seeds: [0]
    scenes: 10
    bodies: [t1, g1, h1]
    pack: []
    results_glob: []
    latent_kw: {upper: true}
    levels: {}
    methods:
      reference:
        - name: teacher
          level: 0
          kind: teacher
          source: scripted_teacher
          policy: 'teacher:h_steps_carry'
          env_kw: {tracker: '<body>:steps_ub_v1'}
nodes:
  teacher_check:
    stage: eval_transfer
    tag: teacher-check
    scope: global
    resources: {cpu: 4, mem: 8G, max_seconds: 14400}
    config:
      options: {transfer: $teacher_check, variant: '-'}
