# T0 (research/readiness.md section B; D-146 R2 HR): the pinned tracker of the humanoid track is present with its recorded sha256. `validate_tracker`
# refuses BEFORE validating when the declared `tracker_sha256` is not the actor file's (check_tracker_sha), so this node is the pin check; the
# validation it then runs is the D-112 gate as a report (`gate: report`: the verdict is data). Run it on the peer, where the store holds the actor.
# Only t1:contact_v2 has a recorded sha256 (w8d install, D-101/D-103/D-107; tests/unit/test_trackers.py pins it too); g1 and h1 `contact_v2` have
# none recorded, so they are not pinned here. A mismatch is fixed by `rrp train tracker-install` of the right actor under a NEW version, never by
# editing the pin. (The armdiv pins of T0, the v7div pack and BC 1701, are AR's.)
extends: ../templates/tracker_gated.yaml
name: humanoid_trackers_pins
schema: dag-1
track: humanoid
policy: tracker
env: mujoco/legged
task: locomotion
bodies: t1
factors: []
lineage: 'trk-pin-{body}'
label_prefix: 'hpin'
vars: {recipe: null, body: t1}
# D-146 R3: the warm-start actors the T1 (gap ring) and T2 (`*_ub`) recipes start from, with their expected sha256 (ssh gb10-direct sha256sum on the peer
# store and on the host copy ~/work/rrp-data/peer-archive/runs/ agree, 2026-09-30). `rrp train tracker-warp` refuses a different file (tracker_recipes.INIT_PINS,
# the same table; tests/unit/test_humanoid_recipes.py compares the two), so a swapped actor stops the run before anything is written.
lists:
  warm_starts:
    artifacts/runs/humanoid_p1b_t1_v2ft4/actor.pt: 69a483590788eb5101b2c0a21b3297d75c322410559960a27bd5ae9f43927dd6
    artifacts/runs/humanoid_p1b_g1_v4ft/actor_v4ftfinal.pt: ad4073fcf954f1e7a9a9a24e74416cbe199cf1240fb5f97778b7198dbdbbec20
    artifacts/runs/humanoid_p1b_h1_r6/actor_r6final.pt: 7304ee7d769764d2b9b301b3dd5b6feab9f2ab306d9e0ddb0447960edb0e37f3
nodes:
  train: null
  validate:
    resources: {cpu: 1, mem: 4G, max_seconds: 7200}
    config:
      inputs: null
      options: {body: '{body}', kind: learned, seeds: 5, robust: true, gate: report, tracker_sha256: 36e9146792743115878c34e0bbf7cc46ccb5419417921358da3658c8377fc591}
