# T1 (research/readiness.md section B; D-146 R2 HR): the h_steps terrain-scan trackers of t1, g1 and h1 (a PUBLIC `terrain_scan` actor input;
# legacy privileged steps actors stay labelled privileged_teacher and are refused by `rrp suite humanoid-steps`). One point per body:
#   train     `rrp train tracker-warp --recipe <recipe> --body <body>` on the peer GPU (2000 iterations x 4096 worlds x 24 steps, scratch)
#   validate  the D-112 tracker gate on the trained actor (tracker_validation protocol v2 + the W6 robustness check); fails the node on `fail`
#   eval      C-MuJoCo h_steps, step heights 0.10 .. 0.30 L (the T1 accept line: success >= 0.9 per body, source privileged_teacher:rl_expert
#             only while extra_obs is not the public scan; the learned scan actor is labelled learned_tracker)
# INSTALL (not a stage; the lead runs it after the gate passed, from the repo root; it refuses unless tracker_sha matches and the verdict is pass):
#   rrp train tracker-install <run of train> --validation <run of validate>/validation.json --body <body> --version steps_scan_v1 --label "<gate>"
# `lists.installs` records the version: the transfer recipes name `<body>:<version>` and a test checks the two agree.
# g1 trains with its own `g1_steps_gpu` (D-146 R3: the g1 yaw-cap reward set of `g1_clock_gpu`; it no longer runs the t1 recipe with --body g1).
extends: ../templates/humanoid_task.yaml
name: humanoid_trackers_steps_scan
schema: dag-1
track: humanoid
policy: tracker
env: mujoco/legged
task: h_steps
bodies: humanoid_pool_v1
factors: []
lineage: 'trk-steps_scan-{body}'
global_lineage: 'trk-steps_scan'
label_prefix: 'hss_{body}'
global_label_prefix: 'hss'
matrix:
  body: [t1, g1, h1]
axis_vars:
  body:
    t1: {recipe: t1_steps_gpu}
    g1: {recipe: g1_steps_gpu}
    h1: {recipe: h1_steps_gpu}
vars: {task: steps, body: null, recipe: null}     # body and recipe come from the matrix point
lists:
  installs: {t1: steps_scan_v1, g1: steps_scan_v1, h1: steps_scan_v1}
# D-147: the broker caps a lease at 6 h (21600 s); the trainer resumes from checkpoint.pt, so a long run is 6 h segments
# (retries 3 = the template's former 24 h budget).
# D-147 (D-117): measured t1 steps_scan trainer (lease 1790906909_59a98a, iters 0-60, 4096 worlds): host RSS peak 2.5 GB, GPU 3.9 GB;
# declared mem 5G + gpu_mem 8G (>= 1.35 x, extra headroom for the larger g1 / h1 models; the t1 lease kept its 24G + 12G).
defaults: {retries: 3, resources: {mem: 5G, gpu_mem: 8G, max_seconds: 21600}}
nodes:
  train:
    # D-147 addendum (lead, 2026-10-01): the one bounded fix attempt of the T1 steps gate = the recorded P2 fix (30 s episodes, level-up 0.6) for
    # g1 / h1; t1 (already running) keeps the pre-registered recipe; a t1 retrain, if its eval fails for the stall, adds `t1` here.
    per:
      body:
        g1: {options: {args: {episode_s: 30, level_up: 0.6}}}
        h1: {options: {args: {episode_s: 30, level_up: 0.6}}}
  validate:
    stage: validate_tracker
    resources: {cpu: 1, mem: 4G, gpu: false, max_seconds: 7200}
    retries: 0
    config:
      inputs: {actor: '@train:actor.pt'}
      options: {body: '{body}', kind: learned, seeds: 10, robust: true}
  eval:
    deps: [validate]
    config:
      options: {task: steps, body: '{body}', seed0: 7200, n: 20, h_fracs: [0.10, 0.15, 0.20, 0.25, 0.30]}
