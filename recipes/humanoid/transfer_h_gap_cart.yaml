# M3 push a cart through a wall gap (held out, evaluation only). (D-146 R2 HR; template recipes/templates/humanoid_transfer_heldout.yaml; nodes listed in research/tracks/humanoid.md section HR.)
# EVAL ONLY (the split is frozen, D-138): no collect, pack, train or adapt node; the template holds the zero-shot `h_carry` checkpoint methods.
# Teacher reference = the scripted teacher over the installed `ub_v1` tracker. `sealed: true` is flipped only by the lead.
extends: ../templates/humanoid_transfer_heldout.yaml
name: humanoid_transfer_h_gap_cart
schema: dag-1
track: humanoid
policy: latent
env: mujoco/legged
task: h_gap_cart
bodies: humanoid_pool_v1
factors: []
vars: {task: h_gap_cart, upper: true, seal0: g1_hands, seal1: n1}
lists:
  transfer:
    name: humanoid_transfer_h_gap_cart
    task: h_gap_cart
    methods:
      reference:
        - name: teacher
          level: 0
          kind: teacher
          source: scripted_teacher
          policy: 'teacher:h_gap_cart'
          env_kw: {tracker: '<body>:ub_v1'}
