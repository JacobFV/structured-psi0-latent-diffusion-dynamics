# ARM LINEAGE (pick_place, 13 training bodies): the structure of scripts/arm_lineage_chain.sh (and its copies
# armnosem_chain.sh, arm_lineage_hybrid.sh, arm_seed2_host.sh) as a variant x seed matrix.
#   stageA -> F0 -> Fft ; bc1 -> rzbcdag1/rzbcdag1long -> bc2/bc3/gen1 -> rzbcdag2 -> rzgendag1 -> gen2 -> rzgendag2
#   -> gen3/gdag1 -> rzgendag3/Fgdag1 -> gdag2 -> Fgdag2h -> final evals (R2 dev seeds, held-out bodies), progression
#   evals (R2 of F0 and Fgdag1, R1 stateless-BC oracle), task-context semantic edits.
# Recipes are the committed configs (configs/ladder/armsemfix, armnosem, armseed2/*): seed s = seed-1 recipe + 1000*(s-1)
# on every training seed and + 1,100,000*(s-1) on every DAgger collection seed (naming.md). Variants: sem = semantic
# NLL with the unbounded log-variance floor (-8, the frozen jointfix/sejf2 recipe), semfix = bounded NLL (-4), nosem =
# no semantic objective (capacity matched). The rendered digest is pinned by `recipe.arm_lineage` in tests/data/golden.json
# (tests/unit/test_recipes.py); the legacy per-run configs it was checked against are retired (legacy area, see the .old index at the repo root).
# Outputs: artifacts/runs/pipeline/arm-<variant>/<stage>[-<tag>]_s<seed>. Usage:
#   rrp run-dag templates/arm_lineage.yaml --dry-run --point variant=semfix,seed=2
#   RRP_PEER_REPO=/dev/shm/rrp-brandonin/wt/pipeline rrp run-dag templates/arm_lineage.yaml --point variant=semfix,seed=3
name: arm_lineage
schema: dag-1
family: arm
track: pipeline
lineage: 'arm-{variant}'
label_prefix: 'w5a_{tg}{seed}'
matrix:
  variant: [sem, semfix, nosem]
  seed: [1, 2]
axis_vars:
  variant:
    sem: {sw: 1.0, lv: -8.0, psw: 1.0, tg: se}
    semfix: {sw: 1.0, lv: -4.0, psw: 1.0, tg: sf}
    nosem: {sw: 0.0, lv: -8.0, psw: 0.0, tg: ns}
vars:
  so: '{1000 * (seed - 1)}'
  soff: '{1100000 * (seed - 1)}'
  pfx: 'w5_arm_{variant}_s{seed}'
  # data/expert inputs (v1 set; the retired arm_lineage_v2 DAG overrode them for the v2-teacher set, D-102)
  dataset: datasets/pick_place_primary_v3dart
  pack: packed/latent_pp_v3dart_s1_H16
  bc_policy: 'runs/baselines_bc_ckpts:direct1701_u12000.pt'
  bc_label: direct1701_u12000
lists:

  bodies: [panda_pg2, parm5_pg2, parm5_tf3, parm5l_tf3, parm5s_pg2, parm6_pg2, parm6_tf3, parm7_pg2, parm7_tf3, sawyer_pg2, sawyer_tf3, ur5e_pg2, ur5e_tf3]
  rep_bodies: [parm5_pg2, parm5_tf3, parm5s_pg2, parm5l_tf3, parm6_pg2, parm6_tf3, parm7_pg2, parm7_tf3, panda_pg2, ur5e_pg2, ur5e_tf3, sawyer_pg2, sawyer_tf3]
  npz: [panda_pg2.npz, parm5_pg2.npz, parm5_tf3.npz, parm5l_tf3.npz, parm5s_pg2.npz, parm6_pg2.npz, parm6_tf3.npz, parm7_pg2.npz, parm7_tf3.npz, sawyer_pg2.npz, sawyer_tf3.npz, ur5e_pg2.npz, ur5e_tf3.npz]
  npz_gen1: [panda_pg2.npz, parm5_pg2.npz, parm5_tf3.npz, parm5l_tf3.npz, parm5s_pg2.npz, parm6_pg2.npz, parm6_tf3.npz, parm7_pg2.npz, parm7_tf3.npz, sawyer_pg2.npz, sawyer_tf3.npz, ur5e_pg2.npz]   # recipe quirk kept: gendag1 omits gen1/ur5e_tf3 and lists bc1, bc2, gen1, bc3 (every lineage since jointfix)
  genctx: [panda_pg2.npz.genctx.pkl, parm5_pg2.npz.genctx.pkl, parm5_tf3.npz.genctx.pkl, parm5l_tf3.npz.genctx.pkl, parm5s_pg2.npz.genctx.pkl, parm6_pg2.npz.genctx.pkl, parm6_tf3.npz.genctx.pkl, parm7_pg2.npz.genctx.pkl, parm7_tf3.npz.genctx.pkl, sawyer_pg2.npz.genctx.pkl, sawyer_tf3.npz.genctx.pkl, ur5e_pg2.npz.genctx.pkl, ur5e_tf3.npz.genctx.pkl]
defaults:
  placement: peer          # one placement for the whole lineage (the peer store holds every artifact)
  retries: 0               # D-061: a failed node blocks its dependants; --retry-failed is a manual decision
  max_parallel: 6
  admission_timeout_s: 10800
  resources: {cpu: 3, mem: 8G, gpu: false, max_seconds: 10800}
base:
  flags: {zero_prev_action: true, realizer_anchor: true, realizer_drop_qd: false, contact_version: contact_v1}
nodes:
  # D-144 addendum (rel-r2c open question 1, closed by the sweep-flags row): `latent.factors` replaces the flag-driven
  # flat `latent.semantic_weight` + `flags.probe_lv_min` pair (docs/relations.md 10, R2's `_probe_factors` shape).
  # `{sw}` (0.0 nosem / 1.0 sem+semfix) sets every `probe.arm.*` weight uniformly; the `per: variant: semfix` override
  # below is the only place `lv_min` differs (-4.0 vs the LatentConfig default -8.0, omitted like R2's own codemod of
  # configs/latent/**.json). `core/runconfig.py`'s `FLAG_SPEC[("arm"|"dual", "train_rep")]` no longer maps
  # `probe_lv_min` (see its own comment); `configs/ladder/**.json` (6 rep files) codemodded to match, byte-identical
  # `LatentConfig.version()` hashes proven by tests/unit/test_relations_r2_latent.py's frozen table.
  stageA:
    stage: train_rep
    resources: {gpu: true, gpu_mem: 16G, cpu: 4, mem: 24G, max_seconds: 14400}
    per:
      variant:
        semfix:
          params:
            latent:
              factors: [{name: probe.arm.visible, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.arm.looking_at, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.arm.focused_on, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.arm.held_by, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.arm.acting_on, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.arm.rel_pos, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.arm.observed_effect, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.arm.subtask, weight: 1.0, params: {lv_min: -4.0}}]
    config:
      inputs: {dataset: '{dataset}', packed_dir: '{pack}'}
      params:
        train_robots: $rep_bodies
        horizon: 16
        stride: 1
        include_dart_failures: true
        seed: '{1706 + so}'
        steps: 15000
        batch_size: 128
        lr: 0.0003
        name: '{pfx}_stageA'
        latent: {name: '{pfx}_stageA', factors: [{name: probe.arm.visible, weight: '{sw}'}, {name: probe.arm.looking_at, weight: '{sw}'}, {name: probe.arm.focused_on, weight: '{sw}'}, {name: probe.arm.held_by, weight: '{sw}'}, {name: probe.arm.acting_on, weight: '{sw}'}, {name: probe.arm.rel_pos, weight: '{sw}'}, {name: probe.arm.observed_effect, weight: '{sw}'}, {name: probe.arm.subtask, weight: '{sw}'}]}
  F0:
    stage: train_flow
    resources: {gpu: true, gpu_mem: 16G, cpu: 4, mem: 24G, max_seconds: 14400}
    config:
      inputs: {representation: '@stageA:representation.pt', packed_dir: '{pack}'}
      options: {final_snapshot_alias: snap_final_s20000.pt}
      params: {name: '{pfx}_F0', seed: '{1701 + so}', steps: 20000, batch_size: 128, lr: 0.0003, packet_semantic_weight: '{psw}', normalize_target: true, snapshot_every: 1000, packet_tau_min: 0.6, policy: {width: 256, heads: 4, ctx_layers: 3, blocks: 6, attention: factorized, name: '{pfx}_F0'}}

  Fft:
    stage: flow_ft
    tag: ft
    resources: {gpu: true, gpu_mem: 16G, cpu: 4, mem: 24G, max_seconds: 10800}
    config:
      inputs: {representation: '@stageA:representation.pt', packed_dir: '{pack}', init_from: '@F0:snap_final_s20000.pt'}
      params: {name: '{pfx}_Fft', seed: '{1702 + so}', steps: 10000, batch_size: 128, lr: 0.0001, packet_semantic_weight: '{psw}', normalize_target: true, snapshot_every: 1000, packet_tau_min: 0.6, policy: {width: 256, heads: 4, ctx_layers: 3, blocks: 6, attention: factorized, name: '{pfx}_Fft'}}
  bc1:
    stage: dagger_collect
    tag: bc1
    resources: {cpu: 12, mem: 32G, max_seconds: 10800}
    config:
      inputs: {representation: '@stageA:representation.pt', bc_policy: '{bc_policy}'}
      options: {mode: bc, genctx: false, expert: bc, bc_label: '{bc_label}', robots: $bodies, episodes: 24, seed_start: '{3200000 + soff}', workers: 4, threads: 3}
  rzbcdag1:
    stage: refit
    tag: bcdag1
    resources: {gpu: true, gpu_mem: 8G, cpu: 3, mem: 20G, max_seconds: 7200}
    config:
      inputs: {representation: '@stageA:representation.pt', packed_dir: '{pack}', dagger: {runs: ['@bc1'], files: $npz}}
      params: {name: '{pfx}_rzbcdag1', dagger_frac: 0.5, prefetch_workers: 0, steps: 4000, batch_size: 128, lr: 0.0001, seed: '{1711 + so}', init: old}
  rzbcdag1long:
    stage: refit
    tag: bcdag1_long
    resources: {gpu: true, gpu_mem: 8G, cpu: 3, mem: 20G, max_seconds: 10800}
    config:
      inputs: {representation: '@stageA:representation.pt', packed_dir: '{pack}', dagger: {runs: ['@bc1'], files: $npz}}
      params: {name: '{pfx}_rzbcdag1long', dagger_frac: 0.5, prefetch_workers: 0, steps: 16000, batch_size: 128, lr: 0.0003, seed: '{1712 + so}', init: old}
  bc2:
    stage: dagger_collect
    tag: bc2
    resources: {cpu: 12, mem: 32G, max_seconds: 10800}
    config:
      inputs: {representation: '@rzbcdag1:representation.pt', bc_policy: '{bc_policy}'}
      options: {mode: bc, genctx: false, expert: bc, bc_label: '{bc_label}', robots: $bodies, episodes: 24, seed_start: '{3300000 + soff}', workers: 4, threads: 3}
  bc3:
    stage: dagger_collect
    tag: bc3
    resources: {cpu: 12, mem: 32G, max_seconds: 10800}
    config:
      inputs: {representation: '@rzbcdag1long:representation.pt', bc_policy: '{bc_policy}'}
      options: {mode: bc, genctx: false, expert: bc, bc_label: '{bc_label}', robots: $bodies, episodes: 24, seed_start: '{3400000 + soff}', workers: 4, threads: 3}
  gen1:
    stage: dagger_collect
    tag: gen1
    resources: {cpu: 12, mem: 32G, max_seconds: 10800}
    config:
      inputs: {representation: '@rzbcdag1long:representation.pt', flow: '@F0:snap_final_s20000.pt', bc_policy: '{bc_policy}'}
      options: {mode: gen, genctx: false, expert: bc, bc_label: '{bc_label}', robots: $bodies, episodes: 24, seed_start: '{3500000 + soff}', workers: 4, threads: 3}
  rzbcdag2:
    stage: refit
    tag: bcdag2
    resources: {gpu: true, gpu_mem: 8G, cpu: 3, mem: 20G, max_seconds: 10800}
    config:
      inputs: {representation: '@rzbcdag1long:representation.pt', packed_dir: '{pack}', dagger: {runs: ['@bc1', '@bc2'], files: $npz}}
      params: {name: '{pfx}_rzbcdag2', dagger_frac: 0.5, prefetch_workers: 0, steps: 16000, batch_size: 128, lr: 0.0003, seed: '{1715 + so}', init: old}
  rzgendag1:
    stage: refit
    tag: gendag1_noqd
    resources: {gpu: true, gpu_mem: 8G, cpu: 3, mem: 20G, max_seconds: 7200}
    config:
      inputs: {representation: '@rzbcdag2:representation.pt', packed_dir: '{pack}', dagger: [{runs: ['@bc1', '@bc2'], files: $npz}, {runs: ['@gen1'], files: $npz_gen1}, {runs: ['@bc3'], files: $npz}]}
      params: {name: '{pfx}_rzgendag1', dagger_frac: 0.6, prefetch_workers: 0, steps: 8000, batch_size: 128, lr: 0.0002, seed: '{1761 + so}', init: old, z_noise_rel: 0.3}
      flags: {zero_prev_action: true, realizer_anchor: true, realizer_drop_qd: true, contact_version: contact_v1}
  gen2:
    stage: dagger_collect
    tag: gen2
    resources: {cpu: 12, mem: 32G, max_seconds: 10800}
    config:
      inputs: {representation: '@rzgendag1:representation.pt', flow: '@F0:snap_final_s20000.pt', bc_policy: '{bc_policy}'}
      options: {mode: gen, genctx: false, expert: bc, bc_label: '{bc_label}', robots: $bodies, episodes: 24, seed_start: '{3700000 + soff}', workers: 4, threads: 3}
  rzgendag2:
    stage: refit
    tag: gendag2_noqd
    resources: {gpu: true, gpu_mem: 8G, cpu: 3, mem: 20G, max_seconds: 7200}
    config:
      inputs: {representation: '@rzgendag1:representation.pt', packed_dir: '{pack}', dagger: {runs: ['@bc1', '@bc2', '@bc3', '@gen1', '@gen2'], files: $npz}}
      params: {name: '{pfx}_rzgendag2', dagger_frac: 0.6, prefetch_workers: 0, steps: 8000, batch_size: 128, lr: 0.0002, seed: '{1790 + so}', init: old, z_noise_rel: 0.3}
      flags: {zero_prev_action: true, realizer_anchor: true, realizer_drop_qd: true, contact_version: contact_v1}
  gen3:
    stage: dagger_collect
    tag: gen3
    resources: {cpu: 12, mem: 32G, max_seconds: 10800}
    config:
      inputs: {representation: '@rzgendag2:representation.pt', flow: '@Fft:policy.pt', bc_policy: '{bc_policy}'}
      options: {mode: gen, genctx: false, expert: bc, bc_label: '{bc_label}', robots: $bodies, episodes: 24, seed_start: '{3800000 + soff}', workers: 4, threads: 3}
  gdag1:
    stage: dagger_collect
    tag: gdag1
    resources: {cpu: 12, mem: 32G, max_seconds: 10800}
    config:
      inputs: {representation: '@rzgendag2:representation.pt', flow: '@Fft:policy.pt', bc_policy: '{bc_policy}'}
      options: {mode: gen, genctx: true, expert: bc, bc_label: '{bc_label}', robots: $bodies, episodes: 24, seed_start: '{3900000 + soff}', workers: 4, threads: 3}
  rzgendag3:
    stage: refit
    tag: gendag3_noqd
    resources: {gpu: true, gpu_mem: 8G, cpu: 3, mem: 20G, max_seconds: 7200}
    config:
      inputs: {representation: '@rzgendag2:representation.pt', packed_dir: '{pack}', dagger: {runs: ['@bc1', '@bc2', '@bc3', '@gen1', '@gen2', '@gen3'], files: $npz}}
      params: {name: '{pfx}_rzgendag3', dagger_frac: 0.6, prefetch_workers: 0, steps: 8000, batch_size: 128, lr: 0.0002, seed: '{1820 + so}', init: old, z_noise_rel: 0.3}
      flags: {zero_prev_action: true, realizer_anchor: true, realizer_drop_qd: true, contact_version: contact_v1}
  Fgdag1:
    stage: flow_ft
    tag: gdag1
    resources: {gpu: true, gpu_mem: 16G, cpu: 4, mem: 24G, max_seconds: 7200}
    config:
      inputs: {representation: '@stageA:representation.pt', packed_dir: '{pack}', init_from: '@F0:snap_final_s20000.pt', gen_dagger: {runs: ['@gdag1'], files: $genctx}}
      params: {name: '{pfx}_Fgdag1', seed: '{1703 + so}', steps: 4000, batch_size: 128, lr: 0.0001, packet_semantic_weight: '{psw}', normalize_target: true, snapshot_every: 1000, packet_tau_min: 0.6, gen_dagger_frac: 0.5, policy: {width: 256, heads: 4, ctx_layers: 3, blocks: 6, attention: factorized, name: '{pfx}_Fgdag1'}}
  gdag2:
    stage: dagger_collect
    tag: gdag2
    resources: {cpu: 12, mem: 32G, max_seconds: 10800}
    config:
      inputs: {representation: '@rzgendag3:representation.pt', flow: '@Fgdag1:policy.pt', bc_policy: '{bc_policy}'}
      options: {mode: gen, genctx: true, expert: bc, bc_label: '{bc_label}', robots: $bodies, episodes: 24, seed_start: '{4000000 + soff}', workers: 4, threads: 3}
  Fgdag2h:
    stage: flow_ft
    tag: gdag2h
    resources: {gpu: true, gpu_mem: 16G, cpu: 4, mem: 24G, max_seconds: 7200}
    config:
      inputs: {representation: '@stageA:representation.pt', packed_dir: '{pack}', init_from: '@Fgdag1:policy.pt', gen_dagger: {runs: ['@gdag1', '@gdag2'], files: $genctx}}
      params: {name: '{pfx}_Fgdag2h', seed: '{1860 + so}', steps: 1500, batch_size: 128, lr: 5e-05, packet_semantic_weight: '{psw}', normalize_target: true, snapshot_every: 500, packet_tau_min: 0.6, gen_dagger_frac: 1.0, policy: {width: 256, heads: 4, ctx_layers: 3, blocks: 6, attention: factorized, name: '{pfx}_Fgdag2h'}}
  # ---- final evaluations of the deployable route (frozen flow Fgdag2h + final system 0 rzgendag3)
  finalevals:
    stage: eval_r2
    tag: final
    resources: {cpu: 3, mem: 8G, max_seconds: 10800}
    config:
      inputs: {flow: '@Fgdag2h:policy.pt', representation: '@rzgendag3:representation.pt'}
      options: {tag: final, robots: [parm6_tf3, panda_pg2], seed_starts: [3000000, 3000100, 3000200], episodes: 30, workers: 1}
  heldout:
    stage: heldout
    tag: final
    resources: {cpu: 3, mem: 8G, max_seconds: 10800}
    config:
      inputs: {flow: '@Fgdag2h:policy.pt', representation: '@rzgendag3:representation.pt'}
      options: {tag: final, robots: [parm5s_tf3, parm5l_pg2], seed_starts: [3000000], episodes: 30, workers: 1}
  # ---- progression rows on the dev seeds
  prog20k:
    stage: eval_r2
    tag: prog20k
    resources: {cpu: 3, mem: 8G, max_seconds: 10800}
    config:
      inputs: {flow: '@F0:snap_final_s20000.pt', representation: '@rzgendag1:representation.pt'}
      options: {tag: prog20k, robots: [parm6_tf3, panda_pg2], seed_starts: [3000000], episodes: 30, workers: 1}
  proggdag1:
    stage: eval_r2
    tag: proggdag1
    resources: {cpu: 3, mem: 8G, max_seconds: 10800}
    config:
      inputs: {flow: '@Fgdag1:policy.pt', representation: '@rzgendag3:representation.pt'}
      options: {tag: proggdag1, robots: [parm6_tf3, panda_pg2], seed_starts: [3000000], episodes: 30, workers: 1}
  orcbc:
    stage: eval_r1
    tag: orcbc
    resources: {cpu: 3, mem: 10G, max_seconds: 10800}
    config:
      inputs: {representation: '@rzgendag3:representation.pt', bc_policy: '{bc_policy}'}
      options: {tag: gendag3noqd, bc_label: '{bc_label}', robots: [panda_pg2, parm6_tf3], seed_starts: [3000000], episodes: 30}
  # ---- task-context semantic-edit suite (D-074/075/077 command) on F0 + rzgendag1, 120 parm6 + 48 panda episodes
  semedits:
    stage: edits
    tag: gen
    resources: {cpu: 9, mem: 18G, max_seconds: 21600}   # broker cap 6 h (was 28800: refused at launch)
    config:
      inputs: {flow: '@F0:snap_final_s20000.pt', representation: '@rzgendag1:representation.pt'}
      options:
        workers: 9
        max_steps: 400
        conditions: control,goal_shift,rebind_desc,irrelevant_distractor,orthogonal_matched,control_replay
        shards:
          - {name: parm6/shard0, robot: parm6_tf3, seed_start: 3000000, episodes: 10}
          - {name: parm6/shard1, robot: parm6_tf3, seed_start: 3000010, episodes: 10}
          - {name: parm6/shard2, robot: parm6_tf3, seed_start: 3000020, episodes: 10}
          - {name: parm6/shard3, robot: parm6_tf3, seed_start: 3000030, episodes: 10}
          - {name: parm6/shard4, robot: parm6_tf3, seed_start: 3000040, episodes: 10}
          - {name: parm6/shard5, robot: parm6_tf3, seed_start: 3000050, episodes: 10}
          - {name: parm6/shard6, robot: parm6_tf3, seed_start: 3000060, episodes: 10}
          - {name: parm6/shard7, robot: parm6_tf3, seed_start: 3000070, episodes: 10}
          - {name: parm6/shard8, robot: parm6_tf3, seed_start: 3000080, episodes: 10}
          - {name: parm6/shard9, robot: parm6_tf3, seed_start: 3000090, episodes: 10}
          - {name: parm6/shard10, robot: parm6_tf3, seed_start: 3000100, episodes: 10}
          - {name: parm6/shard11, robot: parm6_tf3, seed_start: 3000110, episodes: 10}
          - {name: panda/shard0, robot: panda_pg2, seed_start: 3000000, episodes: 8}
          - {name: panda/shard1, robot: panda_pg2, seed_start: 3000008, episodes: 8}
          - {name: panda/shard2, robot: panda_pg2, seed_start: 3000016, episodes: 8}
          - {name: panda/shard3, robot: panda_pg2, seed_start: 3000024, episodes: 8}
          - {name: panda/shard4, robot: panda_pg2, seed_start: 3000032, episodes: 8}
          - {name: panda/shard5, robot: panda_pg2, seed_start: 3000040, episodes: 8}
