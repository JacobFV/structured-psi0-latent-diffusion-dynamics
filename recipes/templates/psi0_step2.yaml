# TEMPLATE: Psi0 step 2 (track psi0, D-098 / D-140): does our structure (packet z[5, 6, 64] realised by a system 0) improve a
# pretrained humanoid VLA? Matched arms on ONE SIMPLE task: the released Psi0 checkpoint (UPSTREAM weights, not trained by us),
# our matched fine-tune of the action head ("direct"), and Psi0 + structure ("structured": system i samples z, the frozen
# Stage A realises it). Same cached features, same split (split_episodes seed 1234), same steps and batch for direct and structured.
# Order: feat (collect: frozen-VLM feature cache) -> labels (probe labels: `psi0_replay` x `simple`, MuJoCo only, through
# harness.rollout + LabelRecorder; source privileged_teacher:sim_replay, labels only) -> stage_a -> probes (packet probes + the
# metadata-only control on E means) -> gate (`rrp train psi0 gate` on stage_a alone: packet_gate.json gate gap >= margin, else
# the node fails and `structured` never starts; structured depends on it) -> direct / structured -> heldout (the later model
# comparison of all arms; its R(E(chunk)) route is an ORACLE)
# -> probes_gen (probes on the generated packets) -> closed loop (eval_*): Isaac Sim through `rrp eval --env simple`,
# seeds 0:10 x repeats via `batch`.
# Prerequisites (host/peer, once): ops/bin/psi0_ext.sh fetch-base / fetch-ckpt / fetch-data <TASK>. Run with the psi venv as
# the peer python (research/tracks/psi0.md); RRP_PSI0_EXT locates the third-party stack.
# D-141: the structured arm needs the training-constant-state-dims mask + forced packet use in Stage A before its closed
# loop means anything (the first step-2 structured arm failed 0/20 for that integration bug). An instance sets name, header
# keys, vars.task / vars.task_key.
name: psi0_step2_template
schema: dag-1
family: psi0
track: psi0
lineage: 'psi0-{task_key}'
label_prefix: 'psi0_{task_key}'
matrix:
  seed: [0]
vars:
  task: SET_IN_INSTANCE
  task_key: SET_IN_INSTANCE
  steps: 8000
defaults:
  placement: peer
  retries: 1
  max_parallel: 2
  max_parallel_gpu: 1
  admission_timeout_s: 21600
  resources: {cpu: 2, mem: 17G, gpu: true, gpu_mem: 18G, max_seconds: 21600}
nodes:
  feat:
    stage: collect
    scope: global
    config:
      options: {task: '{task}'}
  labels:
    stage: labels
    scope: global
    resources: {cpu: 2, mem: 8G, gpu: true, gpu_mem: 4G, max_seconds: 21600}     # MuJoCo only, but upstream's AMO lower-body policy is a CUDA TorchScript (peer smoke: 2.2 GiB peak)
    config:
      inputs: {features: '@feat:feat'}
      options: {task: '{task}'}
  stage_a:
    stage: train_rep
    config:
      params: {batch: 32}
      inputs: {features: '@feat:feat', labels: '@labels:labels'}
      options: {task: '{task}'}
  probes:
    stage: probes
    config:
      inputs: {features: '@feat:feat', labels: '@labels:labels', summary: '@stage_a:summary.json', stage_a: '@stage_a:stage_a.pt'}
      options: {task: '{task}'}
  gate:
    stage: gate
    config:
      inputs: {features: '@feat:feat', summary: '@stage_a:summary.json', stage_a: '@stage_a:stage_a.pt'}
      options: {task: '{task}'}
  direct:
    stage: train_bc
    config:
      params: {steps: '{steps}', batch: 32}
      inputs: {features: '@feat:feat', labels: '@labels:labels'}
      options: {task: '{task}'}
  structured:
    stage: train_flow
    config:
      params: {steps: '{steps}', batch: 32, w_sem: 0.1}
      inputs: {features: '@feat:feat', labels: '@labels:labels', stage_a: '@stage_a:stage_a.pt', gate: '@gate:packet_gate.json'}
      options: {task: '{task}'}
  heldout:
    stage: heldout
    config:
      inputs: {features: '@feat:feat', summary: '@stage_a:summary.json', stage_a: '@stage_a:stage_a.pt', direct: '@direct:final.pt', structured: '@structured:final.pt'}
      options: {task: '{task}'}
  probes_gen:
    stage: probes
    tag: generated
    config:
      inputs: {features: '@feat:feat', labels: '@labels:labels', summary: '@stage_a:summary.json', stage_a: '@stage_a:stage_a.pt', structured: '@structured:final.pt'}
      options: {task: '{task}'}
  eval_released:
    stage: eval_r2
    tag: released
    resources: {cpu: 2, mem: 17G, gpu: true, gpu_mem: 18G, max_seconds: 43200}
    config:
      options: {task: '{task}', arm: released, seeds: '0:10', batch: 2}
  eval_direct:
    stage: eval_r2
    tag: direct
    resources: {cpu: 2, mem: 17G, gpu: true, gpu_mem: 18G, max_seconds: 43200}
    config:
      inputs: {checkpoint: '@direct:final.pt'}
      options: {task: '{task}', arm: direct, seeds: '0:10', batch: 2}
  eval_structured:
    stage: eval_r2
    tag: structured
    resources: {cpu: 2, mem: 17G, gpu: true, gpu_mem: 18G, max_seconds: 43200}
    config:
      inputs: {checkpoint: '@structured:final.pt', stage_a: '@stage_a:stage_a.pt'}
      options: {task: '{task}', arm: structured, seeds: '0:10', batch: 2}
