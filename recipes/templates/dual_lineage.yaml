# TEMPLATE for the dual-arm teacher DATA and the EVALUATION of an external checkpoint (D-126 #33; W12 phase B/C,
# archived note, D-126). Not run by anyone yet: a child instance `recipes/<track>/dual_<name>.yaml` does
# `extends: ../templates/dual_lineage.yaml`, sets name / labels and `vars.checkpoint`.
# PARKED (D-146 item 5, round 2 DP): the dual line is not trained. There is no training node (no Stage A, no flow, no
# refit; no dagger_collect / train_bc either, pipelines/dual.py): the template collects the dual teacher v3 data
# (grasp contact v2.1, W12 contact labels, phase-gated DART, dual dataset gate ENFORCED: check_dual_dataset, needs
# record_quality), packs it, and evaluates an EXTERNAL system-i checkpoint `inputs.checkpoint` (a run id, the
# `vars.checkpoint` placeholder refuses at its missing input until the child names one) on dev pairs (r2), held-out
# pairs (heldout) and the swap_slots packet edit (edits, control = no edit on the same seeds). A dual checkpoint
# trained by a reopened track (new track entry) is what the child points at.
# WAIT for W7's pad-cylinder / gripper-force fix (rrp.bodies.grasp_contact) before running collect: under grasp_v2.1
# the peg slips (W12 audit, 6/24 support_insert successes with teacher v2).
#   rrp run-dag <track>/dual_<name>.yaml --dry-run
#   RRP_PEER_REPO=/dev/shm/rrp-brandonin/wt/w12 rrp run-dag <track>/dual_<name>.yaml
name: dual_lineage_template
schema: dag-1
family: dual
track: w12
lineage: 'dual-eval'
global_lineage: 'dual-v3data'
label_prefix: 'w12e'
global_label_prefix: 'w12d'
vars:
  checkpoint: 'runs/SET_IN_CHILD_DAG:policy.pt'      # run id of the system-i flow to evaluate (external; a child sets it)
lists:
  si_pairs: [panda_pg2__ur5e_pg2, parm5_pg2__parm5_pg2, parm5_tf3__parm7_pg2, parm6_pg2__parm7_tf3, parm6_tf3__parm6_pg2, parm7_pg2__parm5_tf3, sawyer_tf3__ur5e_pg2, ur5e_pg2__sawyer_pg2]
  ho_pairs: [panda_pg2__ur5e_pg2, parm5_pg2__parm5_pg2, parm5_pg2__parm6_tf3, parm6_pg2__parm7_pg2, parm7_tf3__parm5_pg2, ur5e_pg2__sawyer_pg2]
  si_items:
    - {pair: panda_pg2__ur5e_pg2, split: source_train, seed_start: 0, episodes: 100}
    - {pair: parm5_pg2__parm5_pg2, split: source_train, seed_start: 0, episodes: 100}
    - {pair: parm5_tf3__parm7_pg2, split: source_train, seed_start: 0, episodes: 100}
    - {pair: parm6_pg2__parm7_tf3, split: source_train, seed_start: 0, episodes: 100}
    - {pair: parm6_tf3__parm6_pg2, split: source_train, seed_start: 0, episodes: 100}
    - {pair: parm7_pg2__parm5_tf3, split: source_train, seed_start: 0, episodes: 100}
    - {pair: sawyer_tf3__ur5e_pg2, split: source_train, seed_start: 0, episodes: 100}
    - {pair: ur5e_pg2__sawyer_pg2, split: source_train, seed_start: 0, episodes: 100}
  ho_items:
    - {pair: panda_pg2__ur5e_pg2, split: source_train, seed_start: 0, episodes: 100}
    - {pair: parm5_pg2__parm5_pg2, split: source_train, seed_start: 0, episodes: 100}
    - {pair: parm5_pg2__parm6_tf3, split: source_train, seed_start: 0, episodes: 100}
    - {pair: parm6_pg2__parm7_pg2, split: source_train, seed_start: 0, episodes: 100}
    - {pair: parm7_tf3__parm5_pg2, split: source_train, seed_start: 0, episodes: 100}
    - {pair: ur5e_pg2__sawyer_pg2, split: source_train, seed_start: 0, episodes: 100}
  dev_shards:
    - {task: support_insert, pair: parm5_pg2__parm5_pg2, episodes: 20, seed_start: 3000000, max_steps: 1200}
    - {task: support_insert, pair: panda_pg2__ur5e_pg2, episodes: 20, seed_start: 3000000, max_steps: 1200}
    - {task: support_insert, pair: ur5e_pg2__sawyer_pg2, episodes: 20, seed_start: 3000000, max_steps: 1200}
    - {task: handover, pair: parm5_pg2__parm5_pg2, episodes: 20, seed_start: 3000000}
    - {task: handover, pair: panda_pg2__ur5e_pg2, episodes: 20, seed_start: 3000000}
    - {task: handover, pair: ur5e_pg2__sawyer_pg2, episodes: 20, seed_start: 3000000}
  heldout_shards:
    - {task: support_insert, pair: xarm7_pg2__xarm7_pg2, episodes: 30, seed_start: 3100000, max_steps: 1200}
    - {task: support_insert, pair: xarm7_tf3__xarm7_pg2, episodes: 30, seed_start: 3100000, max_steps: 1200}
    - {task: support_insert, pair: parm6_pg2__panda_tf3, episodes: 30, seed_start: 3100000, max_steps: 1200}
    - {task: support_insert, pair: ur5e_pg2__panda_tf3, episodes: 30, seed_start: 3100000, max_steps: 1200}
    - {task: support_insert, pair: aloha, episodes: 30, seed_start: 3100000, max_steps: 1200}
defaults:
  placement: peer          # D-115: nothing heavy on the host
  retries: 0
  max_parallel: 4
  max_parallel_gpu: 1      # lowest peer priority (W8 > W7/arm > W10 > W12)
  max_cpu: 8
  max_mem_gib: 60
  resources: {cpu: 2, mem: 4G, gpu: false, max_seconds: 14400}
base:
  variant: na
  seed: 1
  flags: {contact_version: contact_v1}       # arm/dual worlds: contact_v1 floor model; grasp contact v2.1 via options.grasp_contact
nodes:
  collect_si:
    stage: collect
    scope: global
    tag: si
    resources: {cpu: 8, mem: 14G, disk: 30G, max_seconds: 21600}       # 8 workers x ~1.2 GB x 1.35 (D-117; measure on the smoke)
    config:
      options: {workers: 8, grasp_contact: v2.1}
      params:
        name: support_insert_v3
        task: support_insert
        max_steps: 1200
        noise_levels: [0.0, 0.04]
        noise_burst: [25, 5]
        teacher_version: v3
        noise_phase_gate: true
        contact_labels: true
        record_quality: true
        split_file: research/splits/primary_v1_support_insert.json
        items: $si_items
  collect_ho:
    stage: collect
    scope: global
    tag: ho
    resources: {cpu: 8, mem: 14G, disk: 30G, max_seconds: 21600}
    config:
      options: {workers: 8, grasp_contact: v2.1}
      params:
        name: handover_v3
        task: handover
        max_steps: 800
        stop_after_success: 10
        noise_levels: [0.0, 0.04]
        noise_burst: [25, 5]
        teacher_version: v3
        noise_phase_gate: true
        contact_labels: true
        record_quality: true
        split_file: research/splits/primary_v1_handover.json
        items: $ho_items
  pack:
    stage: pack
    scope: global
    resources: {cpu: 2, mem: 28G, disk: 40G, max_seconds: 14400}      # v1 pack 14 GB for 525k rows; measure first
    config:
      inputs: {datasets: ['@collect_si', '@collect_ho']}
      params:
        horizon: 16
        multi_m: 2
        limits: {T: {morph: 24, scene: 8, task: 32, interact: 64}, N: 16, R: 1024, P: 128}
        sources:
          - {robots: $si_pairs, statuses: [success], include_dart_failures: false}
          - {robots: $ho_pairs, statuses: [success], include_dart_failures: false}
  r2:
    stage: eval_r2
    resources: {cpu: 4, mem: 12G}
    config:
      flags: {zero_prev_action: true}
      inputs: {checkpoint: '{checkpoint}'}
      options: {workers: 4, shards: $dev_shards, grasp_contact: v2.1}
  heldout:
    stage: heldout
    resources: {cpu: 4, mem: 12G}
    config:
      flags: {zero_prev_action: true}
      inputs: {checkpoint: '{checkpoint}'}
      options: {workers: 4, heldout_shards: $heldout_shards, grasp_contact: v2.1}
  edits:
    stage: edits
    resources: {cpu: 4, mem: 12G}
    config:
      flags: {zero_prev_action: true}
      inputs: {checkpoint: '{checkpoint}'}
      options: {workers: 4, shards: $dev_shards, packet_edits: [swap_slots], grasp_contact: v2.1}
