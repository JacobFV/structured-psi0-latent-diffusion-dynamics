# FRAGMENT (D-147, lead 2026-10-04): the `legged-tokens` FAIR-INPUT CONTROL ARM ("legged-none+scan") of recipes/templates/humanoid_transfer.yaml.
# It is recipes/templates/humanoid_transfer_legged_none.yaml with the control lineage `-legged-tokens/` in the (unrendered) eval method paths
# and results glob: the preset `legged-tokens` = the `legged` token layout and inputs (limb / foot tokens, public terrain-scan cells) with every
# relation term off. Same data (shared collect / pack), budgets and seeds as the legged-none arm. An instance
# `recipes/humanoid/transfer_<task>_legged_tokens.yaml` extends `[transfer_<task>.yaml, ../templates/humanoid_transfer_legged_tokens.yaml]`,
# sets vars.rel_preset: legged-tokens, its own label prefix (`hlt_`, outside the humanoid GPU reservation) and is run with
# `run-dag --yield-to-waiting` (lowest priority: idle capacity only). Pre-registered in research/decisions.md before launch.
name: humanoid_transfer_legged_tokens_fragment
schema: dag-1
family: humanoid
track: humanoid
policy: latent
env: mujoco/legged
task: SET_BY_INSTANCE
bodies: humanoid_pool_v1
factors: []
lists:
  transfer:
    results_glob: ['artifacts/runs/humanoid/humanoid-transfer-<task>-*-legged-tokens/eval_transfer*', 'artifacts/runs/humanoid/humanoid-transfer-<task>-*-legged-tokens/sealed_eval*', 'artifacts/runs/humanoid/humanoid-transfer-<task>/eval_transfer*', 'artifacts/runs/humanoid/humanoid-transfer-<task>/sealed_eval*']
    methods:
      level2:
        - name: semfix_zeroshot
          level: 2
          variant: semfix
          kind: latent
          source: learned
          trained: true
          producer: train_flow
          policy: legged_latent
          kw: {flow: 'artifacts/runs/humanoid/humanoid-transfer-<task>-semfix-legged-tokens/train_flow_s<seed>/policy.pt', rep: 'artifacts/runs/humanoid/humanoid-transfer-<task>-semfix-legged-tokens/train_rep_s<seed>/representation.pt'}
        - name: semfix_refit
          level: 2
          variant: semfix
          kind: latent
          source: learned
          trained: true
          budgeted: true
          producer: adapt_refit
          policy: legged_latent
          kw: {flow: 'artifacts/runs/humanoid/humanoid-transfer-<task>-semfix-legged-tokens/train_flow_s<seed>/policy.pt', rep: 'artifacts/runs/humanoid/humanoid-transfer-<task>-semfix-legged-tokens/adapt_refit-<body>-n<budget>_s<seed>/representation.pt'}
          acquisition: 'artifacts/runs/humanoid/humanoid-transfer-<task>-semfix-legged-tokens/adapt_refit-<body>-n<budget>_s<seed>/acquisition.json'
        - name: semfix_joint
          level: 2
          variant: semfix
          kind: latent
          source: learned
          trained: true
          budgeted: true
          producer: adapt_flow
          policy: legged_latent
          kw: {flow: 'artifacts/runs/humanoid/humanoid-transfer-<task>-semfix-legged-tokens/adapt_flow-<body>-n<budget>_s<seed>/policy.pt', rep: 'artifacts/runs/humanoid/humanoid-transfer-<task>-semfix-legged-tokens/adapt_refit-<body>-n<budget>_s<seed>/representation.pt'}
          acquisition: 'artifacts/runs/humanoid/humanoid-transfer-<task>-semfix-legged-tokens/adapt_flow-<body>-n<budget>_s<seed>/acquisition.json'
        - name: nosem_zeroshot
          level: 2
          variant: nosem
          kind: latent
          source: learned
          trained: true
          producer: train_flow
          policy: legged_latent
          kw: {flow: 'artifacts/runs/humanoid/humanoid-transfer-<task>-nosem-legged-tokens/train_flow_s<seed>/policy.pt', rep: 'artifacts/runs/humanoid/humanoid-transfer-<task>-nosem-legged-tokens/train_rep_s<seed>/representation.pt'}
        - name: nosem_refit
          level: 2
          variant: nosem
          kind: latent
          source: learned
          trained: true
          budgeted: true
          producer: adapt_refit
          policy: legged_latent
          kw: {flow: 'artifacts/runs/humanoid/humanoid-transfer-<task>-nosem-legged-tokens/train_flow_s<seed>/policy.pt', rep: 'artifacts/runs/humanoid/humanoid-transfer-<task>-nosem-legged-tokens/adapt_refit-<body>-n<budget>_s<seed>/representation.pt'}
          acquisition: 'artifacts/runs/humanoid/humanoid-transfer-<task>-nosem-legged-tokens/adapt_refit-<body>-n<budget>_s<seed>/acquisition.json'
        - name: nosem_joint
          level: 2
          variant: nosem
          kind: latent
          source: learned
          trained: true
          budgeted: true
          producer: adapt_flow
          policy: legged_latent
          kw: {flow: 'artifacts/runs/humanoid/humanoid-transfer-<task>-nosem-legged-tokens/adapt_flow-<body>-n<budget>_s<seed>/policy.pt', rep: 'artifacts/runs/humanoid/humanoid-transfer-<task>-nosem-legged-tokens/adapt_refit-<body>-n<budget>_s<seed>/representation.pt'}
          acquisition: 'artifacts/runs/humanoid/humanoid-transfer-<task>-nosem-legged-tokens/adapt_flow-<body>-n<budget>_s<seed>/acquisition.json'
        - name: bc_zeroshot
          level: 2
          variant: bc
          kind: bc
          source: bc
          trained: true
          producer: train_bc
          policy: legged_bc
          kw: {checkpoint: 'artifacts/runs/humanoid/humanoid-transfer-<task>-bc-legged-tokens/train_bc_s<seed>/policy.pt'}
        - name: bc_sft
          level: 2
          variant: bc
          kind: bc
          source: bc
          trained: true
          budgeted: true
          producer: adapt_bc
          policy: legged_bc
          kw: {checkpoint: 'artifacts/runs/humanoid/humanoid-transfer-<task>-bc-legged-tokens/adapt_bc-<body>-n<budget>_s<seed>/policy.pt'}
          acquisition: 'artifacts/runs/humanoid/humanoid-transfer-<task>-bc-legged-tokens/adapt_bc-<body>-n<budget>_s<seed>/acquisition.json'
nodes: {}
