# relations_geo SMOKE (plumbing only; NOT a result): the geo instance's relgen -> F0 path end to end on the peer in a few
# minutes. 6 teacher episodes (3 snapshots each) are labelled, then a tiny F0 (120 steps, batch 16; the trainer logs every 100) takes them through
# `params.curriculum` (interval 20) on the v7div pack, with the armdiv semfix stage-A representation instead of a fresh
# stageA; no probes, dev or held-out evaluation. Check `schedule.jsonl` and train_log.jsonl (`n_relgen`, `probe_geo.depth3d`).
#   RRP_PEER_REPO=/dev/shm/rrp-brandonin/wt/<track> rrp run-dag recipes/relations/relations_geo_smoke.yaml --max-parallel-gpu 1
extends: relations_geo.yaml
name: relations_geo_smoke
schema: dag-1
lineage: 'relations-smoke-{fset}'
label_prefix: 'rfsm{fset}{seed}'
matrix:
  fset: [geo]
  seed: [1]
vars:
  pack: packed/latent_pp_v7div_s1_H16
nodes:
  stageA: null
  probes_rep: null
  dev: null
  heldout: null
  relgen:
    resources: {cpu: 3, mem: 8G, max_seconds: 240}
    config:
      options: {n_episodes: 6, max_snapshots: 3}
  F0:
    resources: {gpu: true, gpu_mem: 12G, cpu: 4, mem: 24G, max_seconds: 360}
    per:
      fset:
        geo: {params: {curriculum: {interval: 20, ramp_steps: 120, share_max: 0.4}}}
    config:
      inputs: {representation: runs/armdiv/arm7div-semfix/train_rep_s1/representation.pt}
      options: {final_snapshot_alias: null}
      params: {steps: 120, batch_size: 16, snapshot_every: 60, policy: {width: 64, heads: 2, ctx_layers: 1, blocks: 1}}
