# armdiv G3 (D-137): the ARM v6 lineage recipe on the EXPANDED pool armdiv_pool_v1 (65 keys) and its data (v7div:
# recipes/armdiv/armdiv_data_v7div.yaml; pack packed/latent_pp_v7div_s1_H16). FLATTENED from the former chain
# arm_lineage_v7div -> v6 -> v2 -> arm_lineage (D-145 P1): the training recipe, rounds, seeds, eval sets and edit suite are
# the template's (recipes/templates/arm_lineage.yaml); this file carries the data/expert vars, the pool lists, the
# resource declarations (>= 1.35 x measured peak, D-117; nothing here enters a config hash) and the deltas below.
#   DAgger labeller / stateless-R1 expert = learned:bcv7div_direct1701 (recipes/armdiv/armdiv_bc_v7div.yaml, final checkpoint)
#   grasp contact v2.1 in EVERY simulated stage (`options.grasp_contact`; training stages read packs only)
# Deltas from v6, forced by the larger pool: DAgger rounds collect 5 episodes per body (65 bodies = 325 per round; v6:
# 24 x 13 = 312); the body lists are the pool; semedits / prog20k / proggdag1 / orcbc are dropped; a new-arm dev evaluation
# (newarms) is added. Variants semfix / nosem x seeds 1, 2. Peer only; ONE GPU lease at a time (lead: humanoids first).
# kinfeat ablation: recipes/armdiv/arm_lineage_v7div_kinfeat.yaml; smoke: arm_lineage_v7div_smoke.yaml.
#   RRP_PEER_REPO=/dev/shm/rrp-brandonin/wt/armdiv rrp run-dag recipes/armdiv/arm_lineage_v7div.yaml --max-parallel-gpu 1
