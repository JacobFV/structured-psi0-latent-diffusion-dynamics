# armdiv restart v8div (D-146 item 4, readiness A2): the ARM v6 lineage recipe on the pool armdiv_pool_v1 (65 keys), a NEW
# lineage from `train_rep` on the current code. The partial v7div latent lineage is discarded (its ledger stays frozen under
# artifacts/runs/armdiv/_dags/arm_lineage_v7div/; the old recipes are in the legacy area, see its dags index); there is no legacy-hash shim.
# KEPT inputs, consumed by run id and pinned by sha256 (`options.pin_sha256`, checked by every stage that takes the input;
# not re-hashed otherwise): the v7div pack packed/latent_pp_v7div_s1_H16 (sha256 of its meta.json, 65 pool robots, 1,914,009 rows)
# and the DAgger labeller / stateless-R1 expert = learned:bcv7div_direct1701 (final checkpoint of recipes/armdiv/armdiv_bc_v7div.yaml).
# The held-out evaluation guard compares against the checkpoints' real training bodies (pack meta), not a constant list.
# Training recipe, rounds, seeds, eval sets and edit suite = templates/arm_lineage.yaml; this file carries the vars, the pool
# lists, the resource declarations (>= 1.35 x measured peak, D-117; not in any config hash) and the deltas below.
# Deltas from v6: DAgger rounds collect 5 episodes per body (65 bodies = 325 per round); semedits / prog20k / proggdag1 / orcbc
# are dropped; a new-arm dev evaluation (newarms) is added. Variants semfix / nosem x seeds 1, 2. Peer only; ONE GPU lease at a time.
# `SemanticReadout` / `aux` removal (A1) lands before this lineage trains. kinfeat ablation: arm_lineage_v8div_kinfeat.yaml; smoke: _smoke.
#   RRP_PEER_REPO=/dev/shm/rrp-brandonin/wt/armdiv rrp run-dag recipes/armdiv/arm_lineage_v8div.yaml --max-parallel-gpu 1
