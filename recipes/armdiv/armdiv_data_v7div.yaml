# armdiv G1 (D-137): the v6dart data recipe (teacher v2 + grasp_v2.1 + phase-gated DART 0.08, W6 dataset gate, streaming
# pack H16 stride 1) on the frozen armdiv pool (research/splits/armdiv_pool_v1.json, 65 keys): the 13 v6 items unchanged
# (300 clean + 300 DART each, seed_start 0) + 52 new keys with 64 clean + 64 DART; target demos (150 each, seeds
# 1,000,000+) for the new sealed targets (research/splits/armdiv_v1.json) and the REUSED xarm7 targets.
# The PACK is not a DAG node (a run-dag pack would write under artifacts/runs on the peer /dev/shm, RAM); it runs as a
# leased `rrp data pack --out artifacts/packed/...` (peer disk, <= 25 GB) through ops/bin (armdiv_pack.sh, P3/P4b).
# Memory: v6 collect peak 20.1G at 6 workers (declared 29G); the pack peak is recorded in research/tracks/armdiv.md.
#   RRP_PEER_REPO=/dev/shm/rrp-brandonin/wt/armdiv rrp run-dag recipes/armdiv/armdiv_data_v7div.yaml
extends: ../templates/arm_collect.yaml
name: armdiv_data_v7div
schema: dag-1
track: armdiv
policy: teacher:pick_place_v2_minjerk
env: mujoco/arm
task: pick_place
bodies: armdiv_pool_v1
factors: []
lineage: v7div
label_prefix: adv7
vars:
  dataset: pick_place_armdiv_v7div
  dataset_tag: v7div
  split_file: research/splits/armdiv_v1.json
