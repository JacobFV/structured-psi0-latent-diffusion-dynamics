#   RRP_PEER_REPO=/dev/shm/rrp-brandonin/wt/armdiv rrp run-dag recipes/armdiv/armdiv_bc_v7div.yaml --max-parallel-gpu 1
extends: ../templates/arm_bc.yaml
name: armdiv_bc_v7div
schema: dag-1
track: armdiv
policy: bc
env: mujoco/arm
task: pick_place
bodies: armdiv_pool_v1
factors: []
lineage: 'bcv7div-{seed}'
label_prefix: 'adb{seed}'
matrix:
  seed: [1701, 1702]
vars:
  source_pack: packed/latent_pp_v7div_s1_H16
  bc_label: 'bcv7div_direct{seed}'
