# armdiv G2 SMOKE (plumbing only; NOT a result): train_bc on the v7div pack for 30 updates, 2-episode evaluations.
extends: armdiv_bc_v7div.yaml         # sibling instance
name: armdiv_bc_v7div_smoke
schema: dag-1
track: armdiv
policy: bc
env: mujoco/arm
task: pick_place
bodies: armdiv_pool_v1
factors: []
lineage: 'bcv7div-smoke-{seed}'
label_prefix: 'ads{seed}'
matrix:
  seed: [1701]
nodes:
  train: {config: {params: {epochs: 1, smoke_max_steps: 30}}}
  ev_v6bodies: {config: {options: {episodes: 2}}}
  ev_newarms: {config: {options: {episodes: 2}}}
  ev_heldout: {config: {options: {episodes: 2}}}
  ref_v6bc_newarms: null
