[area.ops]
allow = ["ops/resource-ledger.jsonl", "ops/resources.local.json", "ops/bin/*.sh"]

[area.viz]
# the loopback workbench (ui/, viz/workbench) is retired to .old/ (D-145 addendum); the room is the only viz surface
allow = ["viz/CONTRACT.md", "viz/radar_axes.json", "viz/specs/*.yaml", "viz/room/**"]

[area.old]
allow = [".old/README.md", ".old/**"]
groups_need_readme = true        # every .old/<group>/ has a README.md: what it was, which decisions cite it, moved-in commit

# ------------------------------------------------------------------ live code never reads legacy
[forbid]
# string literals in live trees that point at removed top-level areas or at .old
live_trees = ["src", "tests", "recipes", "ops/bin"]
patterns = ["\\.old/", "[\"'](configs|dags|scripts|tasks|ui)/"]
# eval-latent_slice1.json is byte-frozen (its sha256 is recorded in sealed eval results); its free-text `baselines` notes
# still name the archived configs.
exempt = ["tests/unit/test_layout.py", "recipes/presets/eval-latent_slice1.json"]
