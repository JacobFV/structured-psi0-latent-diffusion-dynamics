# Repository schema (D-145; docs/architecture.md section 13). The ONE file schema of this repo: every tracked path must
# match an `allow` pattern below; tests/unit/test_layout.py enforces it. Glob syntax: `*` = one path segment (no "/"),
# `**` = any depth. Legacy material lives only under `.old/` (mirrors its old path; never read by live code).
version = "repo-schema-1"

[top]
files = ["AGENTS.md", "CLAUDE.md", "README.md", "STATUS.md", "pyproject.toml", "schema.toml", ".gitignore"]
dirs = ["src", "tests", "recipes", "docs", "research", "artifacts", "ops", "viz", ".old"]

# ------------------------------------------------------------------ experiment identity
# track = one line of work (research/tracks/<track>.md, recipes/<track>/, artifacts/runs/<track>/).
# state: open (running / resumable now) | paused (owner wants it; resume recipe in recipes/<track>/) .
# A track that closes moves its note and recipes to .old/ and leaves this table.
[tracks]
humanoid = { state = "open", workstream = "W13", decisions = ["D-138", "D-139", "D-147"] }
armdiv = { state = "paused", workstream = "W7/armdiv", decisions = ["D-137"] }
psi0 = { state = "paused", workstream = "W10", decisions = ["D-141"] }
pointer = { state = "paused", workstream = "pointer / ComputerWorld", decisions = ["D-142"] }
relations = { state = "open", workstream = "relation-factor experiments", decisions = ["D-144"] }
compute = { state = "open", workstream = "compute-aware acceleration (precision / compile / seeds / eval)", decisions = ["D-147"] }

# ------------------------------------------------------------------ allowed paths per area
[area.src]
allow = ["src/rrp/*.py", "src/rrp/**/*.py", "src/rrp/tasks/graphs/*.json"]

[area.tests]
allow = ["tests/__init__.py", "tests/conftest.py", "tests/support.py", "tests/unit/__init__.py", "tests/unit/test_*.py", "tests/unit/_*.py",
         "tests/integration/__init__.py", "tests/integration/test_*.py", "tests/gpu/test_*.py",
         "tests/data/golden.json", "tests/data/*.json"]

[area.recipes]
# run definitions: DAG templates + thin instances; no hand-written per-run config files.
allow = ["recipes/README.md", "recipes/templates/*.yaml", "recipes/presets/*.json", "recipes/*/*.yaml"]
header = ["name", "schema", "track", "policy", "env", "task", "bodies", "factors"]   # required top-level keys (instances)
instance_max_lines = 80                                                               # instances carry vars, not pipelines

[area.docs]
allow = ["docs/architecture.md", "docs/relations.md", "docs/strategy.md", "docs/experiments_roadmap.md",
         "docs/robot_training_considerations.md",
         "docs/paper/rrp_report.tex", "docs/paper/make_figures.py", "docs/paper/factor_tiles.py", "docs/paper/figures/*.pdf", "docs/paper/figures/tiles/*.pdf",
         "docs/paper/figures/*.png", "docs/paper/figures/*.json", "docs/paper/rrp_report.pdf",
         "docs/paper/table_relations.tex", "docs/paper/table_envs.tex", "docs/paper/table_embodiments.tex",
         "docs/paper/fig_tiles.tex"]

[area.research]
allow = ["research/decisions.md", "research/registry.jsonl", "research/relations_catalog.md",
         "research/sources.lock.json", "research/sources.vlm.json", "research/tasks.json",
         "research/splits/*.json", "research/methods/*.md", "research/corrections/*.md",
         "research/reports/evidence_matrix.md", "research/tracks/compute_enable/*.json", "research/readiness.md", "research/tracks/BRIEF.md", "research/tracks/*.md"]
# research/tracks/<name>.md: <name> must be a key of [tracks]

[area.artifacts]
# append-only evidence store: small raw results cited by decisions / reports. Never weights or datasets (.gitignore).
allow = ["artifacts/requirements.json", "artifacts/run_index.json", "artifacts/runs/**", "artifacts/video/*",
         "artifacts/trackers/**", "artifacts/assets/**", "artifacts/receipts/**"]
run_extensions = ["json", "jsonl", "md", "txt", "log", "gz", "out", "csv", "png"]
max_bytes = 4000000
# new runs: artifacts/runs/<track>/<lineage>/<stage>[-tag]_s<seed>/ with <track> in [tracks]. The run directories
# below predate the schema; they are frozen (citations in research/decisions.md point at them) and may not grow.
oversize_frozen = ["artifacts/runs/armexpert/v6dart/collect-v6dart_s1/manifest.json",
                   "artifacts/runs/armexpert/v5dart/collect-v5dart_s1/manifest.json"]
