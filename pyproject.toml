[project]
name = "rrp"
version = "0.1.0"
description = "Relational robot policy: morphology-general structured action research system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
sim = ["mujoco>=3.2"]
service = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "httpx>=0.27"]
ml = ["torch>=2.5"]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
rrp = "rrp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rrp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
  "gpu: requires the verified peer GPU (tier 3)",
  "browser: requires a real browser (tier 2)",
  "slow: longer integration tests",
  "cgroup: exercises real user cgroup enforcement with bounded fixtures",
  "menagerie: needs the MuJoCo Menagerie assets in .cache/assets (skipped when absent; see tests/conftest.py)",
  "packed_data: needs artifacts/packed/latent_pp_v3dart_s1_H16 (skipped when absent)",
]
