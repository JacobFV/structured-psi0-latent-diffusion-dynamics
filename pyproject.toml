[project]
name = "rrp"
version = "0.1.0"
description = "Relational robot policy: morphology-general structured action research system"
requires-python = ">=3.11,<3.13"
# core = contracts, provenance, manifests, statistics, RunConfig / pipelines / run-dag, ops broker (docs/core_api.md)
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
]

[project.optional-dependencies]
sim = ["mujoco>=3.2"]
ml = ["torch>=2.5"]
service = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "httpx>=0.27"]
viz = ["pillow>=10", "imageio>=2.31", "imageio-ffmpeg>=0.4", "matplotlib>=3.8"]
vlm = ["transformers>=4.45", "huggingface_hub>=0.25"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "jsonschema>=4.22"]
all = ["rrp[sim,ml,service,viz,dev]"]

[project.scripts]
rrp = "rrp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rrp"]

# package data the installed rrp needs at runtime (rrp.contracts.paths.data_path falls back to it)
[tool.hatch.build.targets.wheel.force-include]
"tasks" = "rrp/_data/tasks"

[tool.hatch.build.targets.sdist]
include = ["src/rrp", "tasks", "pyproject.toml", "README.md", "docs/architecture.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
  "gpu: requires the verified peer GPU (tier 3)",
  "browser: requires a real browser (tier 2)",
  "slow: longer integration tests",
  "cgroup: exercises real user cgroup enforcement with bounded fixtures",
  "menagerie: needs the MuJoCo Menagerie assets in .cache/assets (skipped when absent; see tests/conftest.py)",
  "packed_data: needs artifacts/packed/latent_pp_v3dart_s1_H16 (skipped when absent)",
]
