# TEMPLATE for FUTURE legged contact_v2 lineages (records refresh 2026-09-27, D-114 / D-123 backlog "validate_tracker stage
# used in DAGs"). Do not run this file directly: a new DAG `dags/legged_v2_<body>.yaml` does
#     extends: templates/legged_v2_gated.yaml
# and sets at least name, lineage / global_lineage / label_prefix / global_label_prefix, vars.body, vars.tracker_sha256
# (the installed contact_v2 tracker's full sha256) and vars.sigmas (the body's DART sigmas). The placeholder sha256 below
# makes the first node (`validate`) refuse at once, before any compute.
# Protocol, recipe, seeds and suites = dags/legged_v2_go2.yaml (D-090 protocol, W8 D-105 / D-113), with GATES ENFORCED (D-112, D-114):
# - `validate` (global, first): stage validate_tracker = rrp.harness.eval.tracker_validation protocol v2 + the W6 robustness trial on
#   the installed tracker, after checking its sha256 against the declaration. A tracker-gate FAIL fails the node (exit 86, no
#   retries) and blocks everything downstream. Resources: 1 CPU, 4G (1.35 x the measured 2.63 GB peak of the 6-tracker
#   backfill, host lease 1790542233_95f525; D-117).
# - `collect` depends on `validate` and runs the D-112 legged dataset gate in ENFORCE mode (no `gate: report`), with the declared
#   tracker sha256 and sourced actuator limits checked in every shard and teacher row.
# A body that needs a recorded exception (as t1, D-113) sets `gate: report` in its own DAG, with a `caveat:` and a decision reference.
# The DAGs that running coordinators execute (legged_v2_t1sl.yaml) and the completed W8 DAGs are NOT changed by this template.
name: legged_v2_gated_template
schema: dag-1
family: legged
track: legged8
lineage: 'legged8-{body}-{variant}'
global_lineage: 'legged8-{body}-v2data'
label_prefix: 'l8x_{tg}{seed}'
global_label_prefix: 'l8x'
matrix:
  variant: [semfix, nosem]
  seed: [0, 1, 2]
axis_vars:
  variant:
    semfix: {sw: 1.0, lv: -4.0, psw: 0.5, tg: fs}
    nosem: {sw: 0.0, lv: -8.0, psw: 0.0, tg: ns}
vars:
  body: anymal_c
  tracker_sha256: SET_IN_CHILD_DAG
  actuator_limits: sourced_v1
  sigmas: '0,0.1,0.2,0.3'
  cseeds: 0-599
  shard: 100
  val_seeds: 5
  rep_steps: 12000
  flow_steps: 12000
  snap_every: 4000
  snap: snap_s4000
  probe_steps: 4000
  bc_steps: 20000
  bc_snap: 5000
  r2seeds: 10000-10029
  edseeds: 10000-10019
  pfx: 'legged8_{variant}_{body}_s{seed}'
lists:
  z_edits: [none, 'probe_yaw:0.6', 'probe_yaw:-0.6', probe_goal_mirror, probe_halt, 'contact:0:1', 'contact:0:0', 'rand_norm:1', 'rand_norm:2', 'rand_norm:4', 'rand_norm:8', 'rand_norm:12', 'rand_norm:16', 'rand_norm:25', zero]
  ctx_edits: [none, mirror_goal, mirror_active, mirror_inactive, halt]
defaults:
  placement: peer
  retries: 0
  max_parallel: 6
  max_parallel_gpu: 2
  max_cpu: 8
  max_mem_gib: 28      # D-106: RAM + GPU declared, summed
  shared_budget: true
  resources: {cpu: 4, mem: 6G, gpu: false, max_seconds: 14400}   # D-117: >= 1.35 x measured 4-worker eval peak 3.23 GB
base:
  flags: {contact_version: contact_v2}
nodes:
  validate:
    stage: validate_tracker
    scope: global
    resources: {cpu: 1, mem: 4G, max_seconds: 3600}
    config:
      options: {body: '{body}', kind: learned, seeds: '{val_seeds}', robust: true, tracker_sha256: '{tracker_sha256}'}
  collect:
    stage: collect
    scope: global
    deps: [validate]
    resources: {cpu: 6, mem: 16G, max_seconds: 10800}
    config:
      options: {body: '{body}', seeds: '{cseeds}', shard_size: '{shard}', workers: 6, sigmas: '{sigmas}', tracker_sha256: '{tracker_sha256}', actuator_limits: '{actuator_limits}'}
  bc:
    stage: train_bc
    scope: global
    resources: {gpu: true, gpu_mem: 4G, cpu: 2, mem: 3G, max_seconds: 14400}
    config:
      inputs: {data: '@collect'}
      params: {name: 'legged8_bc_{body}', bodies: ['{body}'], model: {width: 192, enc_layers: 2, dec_layers: 3}, steps: '{bc_steps}', batch_size: 256, lr: 0.0003, seed: 0, ckpt_every: 500, snap_every: '{bc_snap}'}
  teacher:
    stage: eval_r2
    scope: global
    resources: {cpu: 10, mem: 24G}
    tag: teacher
    deps: [collect]
    config:
      options: {body: '{body}', tag: 'v2_teacher_{body}', route: teacher, seeds: '{r2seeds}', workers: 10, tracker_sha256: '{tracker_sha256}'}
  bcr2:
    stage: eval_r2
    scope: global
    resources: {cpu: 10, mem: 24G}
    tag: bc
    config:
      inputs: {bc: '@bc:policy.pt'}
      options: {body: '{body}', tag: 'v2_bc_{body}', route: bc, seeds: '{r2seeds}', workers: 10}
  rep:
    stage: train_rep
    resources: {gpu: true, gpu_mem: 4G, cpu: 2, mem: 3G, max_seconds: 14400}
    per:
      variant:
        semfix:
          params:
            latent:
              factors: [{name: probe.legged.contact, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.legged.goal, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.legged.disp, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.legged.subtask, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.legged.fall, weight: 1.0, params: {lv_min: -4.0}}]
    config:
      flags: {qd_dropout: 0.5}
      inputs: {data: '@collect'}
      params: {name: '{pfx}_rep', bodies: ['{body}'], latent: {dz: 32, width: 192, factors: [{name: probe.legged.contact, weight: '{sw}'}, {name: probe.legged.goal, weight: '{sw}'}, {name: probe.legged.disp, weight: '{sw}'}, {name: probe.legged.subtask, weight: '{sw}'}, {name: probe.legged.fall, weight: '{sw}'}], beta_kl: 0.001}, steps: '{rep_steps}', batch_size: 256, lr: 0.0003, seed: '{seed}', ckpt_every: 500, snap_every: '{snap_every}'}
  probe:
    stage: probes
    only: {variant: [nosem]}
    resources: {gpu: true, gpu_mem: 4G, cpu: 1, mem: 3G, max_seconds: 7200}
    config:
      inputs: {representation: '@rep:representation.pt'}
      options: {steps: '{probe_steps}'}
  flow:
    stage: train_flow
    resources: {gpu: true, gpu_mem: 4G, cpu: 2, mem: 3G, max_seconds: 14400}
    config:
      inputs: {representation: '@rep:representation.pt'}
      params: {name: '{pfx}_flow', width: 256, layers: 4, packet_semantic_weight: '{psw}', packet_tau_min: 0.6, steps: '{flow_steps}', batch_size: 256, lr: 0.0003, seed: '{seed}', ckpt_every: 500, snap_every: '{snap_every}'}
  r2snap:
    stage: eval_r2
    tag: snap
    config:
      inputs: {flow: '@flow:{snap}.pt'}
      options: {body: '{body}', tag: 'v2_{variant}_{body}_s{seed}_{snap}', route: r2, seeds: '{r2seeds}', workers: 4}
  r2final:
    stage: eval_r2
    tag: policy
    config:
      inputs: {flow: '@flow:policy.pt'}
      options: {body: '{body}', tag: 'v2_{variant}_{body}_s{seed}_policy', route: r2, seeds: '{r2seeds}', workers: 4}
  zedits:
    stage: edits
    tag: z
    per: {variant: {nosem: {inputs: {posthoc_probe: '@probe:probe_posthoc.pt'}}}}
    config:
      inputs: {flow: '@flow:{snap}.pt'}
      options: {body: '{body}', suite: 'r2_v2_{variant}_{body}_s{seed}_{snap}', route: r2, edits: $z_edits, seeds: '{edseeds}', t_edit: 2.0, max_s: 5.0, workers: 4, mirror_effect: [probe_goal_mirror, rand_norm_8]}
  ctxedits:
    stage: edits
    tag: ctx
    per: {variant: {nosem: {inputs: {posthoc_probe: '@probe:probe_posthoc.pt'}}}}
    config:
      inputs: {flow: '@flow:{snap}.pt'}
      options: {body: '{body}', suite: 'r2ctx_v2_{variant}_{body}_s{seed}_{snap}', route: r2, edits: $ctx_edits, seeds: '{edseeds}', t_edit: 2.0, max_s: 5.0, workers: 4, mirror_effect: [mirror_goal, mirror_active, mirror_inactive, halt]}
