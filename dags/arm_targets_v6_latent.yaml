# ARM V6 TARGET BODIES, latent route (roadmap core claim #9; D-134 lead request): the v6 lineages (dags/arm_lineage_v6.yaml,
# D-134: semfix / nosem x seeds 1, 2) on the SEALED target bodies xarm7_pg2 / xarm7_tf3 / panda_tf3 under
# configs/eval/latent_slice1.json: zero-shot, flow SFT and system-0 refit at budgets 5 / 20 / 100 (adapt seed 1700+seed),
# plus the source-competence cells on the protocol's held-out source bodies. Everything else from the template
# (dags/templates/arm_targets_latent.yaml). grasp_contact v2.1 on every node (template base.options). Peer only.
#   rrp run-dag dags/arm_targets_v6_latent.yaml --dry-run
#   RRP_PEER_REPO=/dev/shm/rrp-brandonin/wt/armtgt rrp run-dag dags/arm_targets_v6_latent.yaml
extends: templates/arm_targets_latent.yaml
name: arm_targets_v6_latent
track: armtgt
lineage: 'armtgt6-{variant}-{target}'
global_lineage: 'armtgt6-data'
label_prefix: 'at6{tg}{seed}{tk}'
global_label_prefix: 'at6d'
vars:
  flow_ref: 'runs/armv6/arm6-{variant}/flow_ft-gdag2h_s{seed}:policy.pt'
  rep_ref: 'runs/armv6/arm6-{variant}/refit-gendag3_noqd_s{seed}:representation.pt'
  dataset: runs/armexpert/v6dart/collect-v6dart_s1
  grasp_contact: v2.1
defaults:
  max_parallel: 6
  max_parallel_gpu: 2   # lead: 2-3 peer GPU leases in total across the latent + BC coordinators
  max_cpu: 9
nodes:
  # Memory (D-117, measured on the first node of each stage type, 09:37-09:39, xarm7_pg2): target_eval 1.83G, flow SFT
  # 1.75G, system-0 refit 1.61G, BC SFT 1.59G, pack 1.59G (cgroup memory.peak) -> 4G each (>= 1.35x); adaptation GPU
  # Sealed evals 8G (10:03): panda_tf3 evals peaked >= 3.45-3.55G while throttled at 0.8 x 4G (xarm7 evals 1.8-2.0G).
  # 8G: the lease caps each process at the declared gpu_mem; BC SFT b20 hit CUDA OOM at 3.19G under a 3G cap (09:41),
  # so the true peak is > 3.2G and unmeasured -> 8G. Limits do not enter config hashes.
  pack_xarm7_pg2: {resources: {mem: 4G}}
  pack_xarm7_tf3: {resources: {mem: 4G}}
  pack_panda_tf3: {resources: {mem: 4G}}
  src_parm5s_tf3: {resources: {mem: 8G}}
  src_parm5l_pg2: {resources: {mem: 8G}}
  zs: {resources: {mem: 8G}}
  fev5: {resources: {mem: 8G}}
  fev20: {resources: {mem: 8G}}
  fev100: {resources: {mem: 8G}}
  rev5: {resources: {mem: 8G}}
  rev20: {resources: {mem: 8G}}
  rev100: {resources: {mem: 8G}}
  fsft5: {resources: {mem: 4G, gpu_mem: 8G}}
  fsft20: {resources: {mem: 4G, gpu_mem: 8G}}
  fsft100: {resources: {mem: 4G, gpu_mem: 8G}}
  rz5: {resources: {mem: 4G, gpu_mem: 8G}}
  rz20: {resources: {mem: 4G, gpu_mem: 8G}}
  rz100: {resources: {mem: 4G, gpu_mem: 8G}}
