# ARM V6 TARGET BODIES, direct-action BC baselines (roadmap #10; D-134 lead request): the v6 BC expert seeds 1701 / 1702
# (REUSED, not retrained: armexpert_bcv6 final checkpoints; 1701 is also the lineages' DAgger labeller) on the same data
# (v6dart target demos), sealed protocol, harness, budgets and acquisition as dags/arm_targets_v6_latent.yaml.
# adapt_seed = the BC seed (template). Training nodes dropped. grasp_contact v2.1 on every node. Peer only.
#   RRP_PEER_REPO=/dev/shm/rrp-brandonin/wt/armtgt rrp run-dag dags/arm_targets_v6_bc.yaml
extends: templates/arm_targets_bc.yaml
name: arm_targets_v6_bc
track: armtgt
lineage: 'armtgt6-bc{seed}-{target}'
global_lineage: 'armtgt6-bcsrc'
label_prefix: 'at6b{seed}{tk}'
global_label_prefix: 'at6bs'
matrix:
  seed: [1701, 1702]
  target: [xarm7_pg2, xarm7_tf3, panda_tf3]
vars:
  dataset: runs/armexpert/v6dart/collect-v6dart_s1
  source_pack: packed/latent_pp_v6dart_s1_H16
  grasp_contact: v2.1
  bc_ref: 'runs/armexpert_bcv6/baseline_direct_action/seed{seed}/source:policy.pt'
  bc_label: 'bcv6_direct{seed}_final'
defaults:
  max_parallel: 6
  max_parallel_gpu: 1   # lead: 2-3 peer GPU leases in total across the latent + BC coordinators
  max_cpu: 6
nodes:
  # Memory (D-117, measured on the first node of each stage type, 09:37-09:39, xarm7_pg2): target_eval 1.83G, flow SFT
  # 1.75G, system-0 refit 1.61G, BC SFT 1.59G, pack 1.59G (cgroup memory.peak) -> 4G each (>= 1.35x); adaptation GPU
  # 8G: the lease caps each process at the declared gpu_mem; BC SFT b20 hit CUDA OOM at 3.19G under a 3G cap (09:41),
  # so the true peak is > 3.2G and unmeasured -> 8G. Limits do not enter config hashes.
  pack_xarm7_pg2: {resources: {mem: 4G}}
  pack_xarm7_tf3: {resources: {mem: 4G}}
  pack_panda_tf3: {resources: {mem: 4G}}
  src_parm5s_tf3: {resources: {mem: 4G}}
  src_parm5l_pg2: {resources: {mem: 4G}}
  zs: {resources: {mem: 4G}}
  ev5: {resources: {mem: 4G}}
  ev20: {resources: {mem: 4G}}
  ev100: {resources: {mem: 4G}}
  sft5: {resources: {mem: 4G, gpu_mem: 8G}}
  sft20: {resources: {mem: 4G, gpu_mem: 8G}}
  sft100: {resources: {mem: 4G, gpu_mem: 8G}}
  train_bc1702: null
  train_bc1703: null
