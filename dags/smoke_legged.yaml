# W5 tiny CPU smoke of the legged pipeline through run-dag on the HOST broker: Stage A (30 steps) -> post-hoc probe
# (20 steps) -> flow (60 steps) on the W3 provenance smoke shards (go2, 21 episodes; copy them to
# artifacts/datasets/w5_smoke_legged). Plumbing check only: these tiny models are not results.
name: smoke_legged
schema: dag-1
family: legged
track: pipeline
lineage: smoke-legged-go2
label_prefix: w5smoke
defaults:
  placement: host
  max_parallel: 1
  resources: {cpu: 1, mem: 3G, gpu: false, max_seconds: 1800}
base:
  variant: semfix
  seed: 0
  flags: {qd_dropout: 0.5, contact_version: contact_v1}
nodes:
  rep:
    stage: train_rep
    config:
      inputs: {data: datasets/w5_smoke_legged}
      params: {bodies: [go2], latent: {dz: 32, width: 64, factors: [{name: probe.legged.contact, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.legged.goal, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.legged.disp, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.legged.subtask, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.legged.fall, weight: 1.0, params: {lv_min: -4.0}}], beta_kl: 0.001}, steps: 30, batch_size: 32, lr: 0.0003, seed: 0, ckpt_every: 10, snap_every: 0}
  probe:
    stage: probes
    config:
      inputs: {representation: '@rep:representation.pt'}
      options: {steps: 20}
  flow:
    stage: train_flow
    config:
      inputs: {representation: '@rep:representation.pt'}
      params: {width: 64, layers: 2, packet_semantic_weight: 0.5, packet_tau_min: 0.6, steps: 60, batch_size: 32, lr: 0.0003, seed: 0, ckpt_every: 20, snap_every: 0}
