# armdiv G3 (D-137): ARM v6 lineages (dags/arm_lineage_v6.yaml -> v2 -> arm_lineage.yaml: identical recipe, steps,
# seeds, DAgger rounds, refits, flow fine-tunes) on the EXPANDED pool armdiv_pool_v1 (65 keys) and its data:
#   data  = v7div (dags/armdiv_data_v7div.yaml; pack packed/latent_pp_v7div_s1_H16)
#   DAgger labeller / stateless-R1 expert = learned:bcv7div_direct1701 (dags/armdiv_bc_v7div.yaml, final checkpoint)
# Changes from v6, all forced by the larger pool: (1) DAgger rounds collect 5 episodes per body (65 bodies = 325 per
# round; v6: 24 x 13 = 312), so the per-round data volume and cost match v6; (2) the body lists are the pool;
# (3) diagnostic nodes not needed for the armdiv question are dropped (semedits, prog20k, proggdag1, orcbc); a new-arm
# dev evaluation (newarms) is added next to finalevals / heldout. Variants semfix / nosem x seeds 1, 2.
# kinfeat ablation lineages: dags/arm_lineage_v7div_kinfeat.yaml (extends this file).
# Peer only; ONE GPU lease at a time (lead: humanoids first).
#   RRP_PEER_REPO=/dev/shm/rrp-brandonin/wt/armdiv rrp run-dag dags/arm_lineage_v7div.yaml --max-parallel-gpu 1
