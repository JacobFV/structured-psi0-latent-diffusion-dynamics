# armdiv G1 (D-137): the v6dart data recipe (teacher v2 + grasp_v2.1 + phase-gated DART 0.08, W6 dataset gate, streaming
# pack H16 stride 1) on the frozen armdiv pool (research/splits/armdiv_pool_v1.json, 65 keys): the 13 v6 items unchanged
