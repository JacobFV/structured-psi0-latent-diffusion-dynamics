# 1,000,000+) for the new sealed targets (research/splits/armdiv_v1.json) and the REUSED xarm7 targets.
# The PACK is not a DAG node: a run-dag pack writes under artifacts/runs (peer /dev/shm, RAM, ~13 GB free) and out_dir
# is derived; it runs as a leased `rrp data pack --out artifacts/packed/...` (peer disk) via scripts/armdiv_pack.sh,
# <= 25 GB (lead). Memory: v6 collect peak 20.1G at 6 workers (declared 29G); pack peak 12.9G at 1.0M rows ->
# ~2.1M rows here (smoke: 160 rows per new-arm episode, 11.2 KB per row as v6 -> ~23 GB), declared 36G (provisional; the measured peak is recorded in the track notes).
#   RRP_PEER_REPO=/dev/shm/rrp-brandonin/wt/armdiv rrp run-dag dags/armdiv_data_v7div.yaml
