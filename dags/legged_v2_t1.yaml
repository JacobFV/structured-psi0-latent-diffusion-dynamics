# PAUSED (D-107, 2026-09-27): the t1 body had joint torque limits 2-3x the manufacturer limits (knee 130 vs 60 N m, ankle 50 vs
# 20). Do not run this DAG. Rerun t1 from collection once the contact agent delivers a sourced-limit tracker: update the
# declared tracker_sha256 (the pipeline refuses data/rows from any other tracker) and use a fresh lineage/ledger.
# W8 WAVE 2 (D-103): t1 on contact_v2. Generated from dags/legged_v2_anymal.yaml (same protocol, recipe, seeds and suites);
# changes: body, DART sigmas (0,0.05,0.1,0.15, as the body's v1 legged_latent data), names/labels, and the declared tracker
# learned_tracker:t1:contact_v2 turn-trained (artifacts/runs/contact_t1_turn2) (sha256 0d77322c0248e019403413da11aa118d782a08db42c8b7050cc40ed8b8f6c804), checked in the collect shards and the teacher rows. Ideal PD actuators (the default; the
# realistic actuator model of D-103 is not applied). LIMITATION: the turn-trained t1 tracker has a wide lunging stance and forward ratio 0.84 (D-103).
name: legged_v2_t1
schema: dag-1
family: legged
track: legged8
lineage: 'legged8-{body}-{variant}'
global_lineage: 'legged8-{body}-v2data'
label_prefix: 'l8t_{tg}{seed}'
global_label_prefix: 'l8t'
matrix:
  variant: [semfix, nosem]
  seed: [0, 1, 2]
axis_vars:
  variant:
    semfix: {sw: 1.0, lv: -4.0, psw: 0.5, tg: fs}
    nosem: {sw: 0.0, lv: -8.0, psw: 0.0, tg: ns}
vars:
  body: t1
  cseeds: 0-599
  shard: 100
  rep_steps: 12000
  flow_steps: 12000
  snap_every: 4000
  snap: snap_s4000
  probe_steps: 4000
  bc_steps: 20000
  bc_snap: 5000
  r2seeds: 10000-10029
  edseeds: 10000-10019
  pfx: 'legged8_{variant}_{body}_s{seed}'
lists:
  z_edits: [none, 'probe_yaw:0.6', 'probe_yaw:-0.6', probe_goal_mirror, probe_halt, 'contact:0:1', 'contact:0:0', 'rand_norm:1', 'rand_norm:2', 'rand_norm:4', 'rand_norm:8', 'rand_norm:12', 'rand_norm:16', 'rand_norm:25', zero]
  ctx_edits: [none, mirror_goal, mirror_active, mirror_inactive, halt]
defaults:
  placement: peer
  retries: 0
  max_parallel: 6
  max_parallel_gpu: 2
  max_cpu: 8
  max_mem_gib: 28      # D-106: RAM + GPU declared, summed
  shared_budget: true
  resources: {cpu: 4, mem: 6G, gpu: false, max_seconds: 14400}   # D-117: >= 1.35 x measured 4-worker eval peak 3.23 GB
base:
  flags: {contact_version: contact_v2}
nodes:
  collect:
    stage: collect
    scope: global
    resources: {cpu: 6, mem: 16G, max_seconds: 10800}
    config:
      options: {body: '{body}', seeds: '{cseeds}', shard_size: '{shard}', workers: 6, sigmas: '0,0.05,0.1,0.15', tracker_sha256: 0d77322c0248e019403413da11aa118d782a08db42c8b7050cc40ed8b8f6c804}
  bc:
    stage: train_bc
    scope: global
    resources: {gpu: true, gpu_mem: 4G, cpu: 2, mem: 3G, max_seconds: 14400}
    config:
      inputs: {data: '@collect'}
      params: {name: 'legged8_bc_{body}', bodies: ['{body}'], model: {width: 192, enc_layers: 2, dec_layers: 3}, steps: '{bc_steps}', batch_size: 256, lr: 0.0003, seed: 0, ckpt_every: 500, snap_every: '{bc_snap}'}
  teacher:
    stage: eval_r2
    scope: global
    resources: {cpu: 10, mem: 24G}
    tag: teacher
    deps: [collect]
    config:
      options: {body: '{body}', tag: 'v2_teacher_{body}', route: teacher, seeds: '{r2seeds}', workers: 10, tracker_sha256: 0d77322c0248e019403413da11aa118d782a08db42c8b7050cc40ed8b8f6c804}
  bcr2:
    stage: eval_r2
    scope: global
    resources: {cpu: 10, mem: 24G}
    tag: bc
    config:
      inputs: {bc: '@bc:policy.pt'}
      options: {body: '{body}', tag: 'v2_bc_{body}', route: bc, seeds: '{r2seeds}', workers: 10}
  rep:
    stage: train_rep
    resources: {gpu: true, gpu_mem: 4G, cpu: 2, mem: 3G, max_seconds: 14400}
    per:
      variant:
        semfix:
          params:
            latent:
              factors: [{name: probe.legged.contact, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.legged.goal, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.legged.disp, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.legged.subtask, weight: 1.0, params: {lv_min: -4.0}}, {name: probe.legged.fall, weight: 1.0, params: {lv_min: -4.0}}]
    config:
      flags: {qd_dropout: 0.5}
      inputs: {data: '@collect'}
      params: {name: '{pfx}_rep', bodies: ['{body}'], latent: {dz: 32, width: 192, factors: [{name: probe.legged.contact, weight: '{sw}'}, {name: probe.legged.goal, weight: '{sw}'}, {name: probe.legged.disp, weight: '{sw}'}, {name: probe.legged.subtask, weight: '{sw}'}, {name: probe.legged.fall, weight: '{sw}'}], beta_kl: 0.001}, steps: '{rep_steps}', batch_size: 256, lr: 0.0003, seed: '{seed}', ckpt_every: 500, snap_every: '{snap_every}'}
  probe:
    stage: probes
    only: {variant: [nosem]}
    resources: {gpu: true, gpu_mem: 4G, cpu: 1, mem: 3G, max_seconds: 7200}
    config:
      inputs: {representation: '@rep:representation.pt'}
      options: {steps: '{probe_steps}'}
  flow:
    stage: train_flow
    resources: {gpu: true, gpu_mem: 4G, cpu: 2, mem: 3G, max_seconds: 14400}
    config:
      inputs: {representation: '@rep:representation.pt'}
      params: {name: '{pfx}_flow', width: 256, layers: 4, packet_semantic_weight: '{psw}', packet_tau_min: 0.6, steps: '{flow_steps}', batch_size: 256, lr: 0.0003, seed: '{seed}', ckpt_every: 500, snap_every: '{snap_every}'}
  r2snap:
    stage: eval_r2
    tag: snap
    config:
      inputs: {flow: '@flow:{snap}.pt'}
      options: {body: '{body}', tag: 'v2_{variant}_{body}_s{seed}_{snap}', route: r2, seeds: '{r2seeds}', workers: 4}
  r2final:
    stage: eval_r2
    tag: policy
    config:
      inputs: {flow: '@flow:policy.pt'}
      options: {body: '{body}', tag: 'v2_{variant}_{body}_s{seed}_policy', route: r2, seeds: '{r2seeds}', workers: 4}
  zedits:
    stage: edits
    tag: z
    per: {variant: {nosem: {inputs: {posthoc_probe: '@probe:probe_posthoc.pt'}}}}
    config:
      inputs: {flow: '@flow:{snap}.pt'}
      options: {body: '{body}', suite: 'r2_v2_{variant}_{body}_s{seed}_{snap}', route: r2, edits: $z_edits, seeds: '{edseeds}', t_edit: 2.0, max_s: 5.0, workers: 4, mirror_effect: [probe_goal_mirror, rand_norm_8]}
  ctxedits:
    stage: edits
    tag: ctx
    per: {variant: {nosem: {inputs: {posthoc_probe: '@probe:probe_posthoc.pt'}}}}
    config:
      inputs: {flow: '@flow:{snap}.pt'}
      options: {body: '{body}', suite: 'r2ctx_v2_{variant}_{body}_s{seed}_{snap}', route: r2, edits: $ctx_edits, seeds: '{edseeds}', t_edit: 2.0, max_s: 5.0, workers: 4, mirror_effect: [mirror_goal, mirror_active, mirror_inactive, halt]}
